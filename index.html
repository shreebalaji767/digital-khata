<!doctype html>
<html lang="en"><head>

<meta name="theme-color" content="#f5f7fb"><meta name="description" content="Digital Khata — offline-first business ledger, billing and inventory.">

<title>Digital Khata — Business Manager</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#182230;--muted:#697586;--line:#e6eaf0;--blue:#2457d6;--blue2:#eaf0ff;--green:#16845b;--red:#c44444;--shadow:0 8px 28px #1a2a4410;--radius:16px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8eafff;outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brand-mark{width:38px;height:38px;border-radius:12px;background:#2457d6;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.business-select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#f9fafc;color:var(--ink)}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#99a2af;padding:8px 12px 4px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#526071;display:flex;align-items:center;gap:12px;font-weight:600}.nav button:hover{background:#f5f7fb}.nav button.active{background:var(--blue2);color:var(--blue)}.nav .ico{width:19px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;color:var(--muted);font-size:11px;line-height:1.6}.main{min-width:0}.topbar{height:72px;background:#ffffffd9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.top-left{display:flex;align-items:center;gap:12px}.topbar h1{font-size:18px;margin:0;letter-spacing:-.4px}.eyebrow{font-size:11px;color:var(--muted);margin-top:3px}.top-actions{display:flex;align-items:center;gap:9px}.content{padding:26px 30px 44px;max-width:1500px;margin:auto}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}.stat{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.stat-label{font-size:12px;color:var(--muted);font-weight:600}.stat-value{font-size:25px;font-weight:800;letter-spacing:-.8px;margin-top:10px}.stat-note{font-size:11px;color:var(--muted);margin-top:5px}.stat-icon{width:36px;height:36px;border-radius:11px;background:#edf2ff;display:grid;place-items:center;font-size:17px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.section-head h2{font-size:15px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:4px 0 0}.two-col{grid-template-columns:1.35fr 1fr}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px}.btn:hover{background:#f7f9fc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1948bf}.btn.soft{background:var(--blue2);border-color:transparent;color:var(--blue)}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;min-height:30px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}.search{position:relative;min-width:210px;max-width:340px;flex:1}.search input{width:100%;padding:10px 12px 10px 35px;border:1px solid var(--line);border-radius:10px;background:#fff}.search span{position:absolute;left:12px;top:10px;color:#929baa}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf0f4}th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#8590a0;background:#fafbfd}td{font-size:12px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcfe}.amount{font-weight:750;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--red)}.muted{color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#f0f2f5;color:#5f6978;font-size:10px;font-weight:750}.pill.green{background:#e6f6ef;color:#13734e}.pill.red{background:#fff0f0;color:#b13c3c}.pill.amber{background:#fff4df;color:#96600e}.empty{text-align:center;padding:34px 12px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#596576}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #dfe4eb;border-radius:9px;background:#fff;color:var(--ink);min-height:40px}.field textarea{min-height:76px;resize:vertical}.hint{font-size:10px;color:var(--muted);line-height:1.5}.modal{border:0;border-radius:18px;padding:0;width:min(620px,calc(100vw - 24px));max-height:90vh;box-shadow:0 24px 90px #10182844}.modal::backdrop{background:#15203366;backdrop-filter:blur(3px)}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:16px;margin:0}.modal-body{padding:20px 22px;overflow:auto;max-height:calc(90vh - 135px)}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.icon-btn{border:0;background:transparent;font-size:20px;color:var(--muted);padding:4px 8px}.notice{padding:12px 14px;border-radius:11px;background:#f1f5ff;color:#36549b;font-size:12px;line-height:1.5}.notice.warn{background:#fff6e6;color:#88580d}.quick-grid{grid-template-columns:repeat(4,1fr)}.quick{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;text-align:left;display:grid;gap:9px;color:var(--ink)}.quick:hover{border-color:#b7c8fa;background:#fbfcff}.quick span:first-child{font-size:19px}.quick strong{font-size:12px}.quick small{font-size:10px;color:var(--muted)}.mobile-menu{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172333;color:white;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:30;font-size:12px}.hidden{display:none!important}.business-card{display:flex;align-items:center;gap:12px}.business-avatar{width:42px;height:42px;border-radius:13px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.progress{height:7px;border-radius:9px;background:#edf0f5;overflow:hidden}.progress i{display:block;height:100%;background:#6f91e8;border-radius:9px}.footer-note{text-align:center;color:#9aa3b0;font-size:10px;padding:25px 0 0}
@media(max-width:1050px){.app{grid-template-columns:220px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:22px}.topbar{padding:0 22px}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:20;left:-270px;top:0;width:260px;transition:left .22s;box-shadow:12px 0 40px #14213b22}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{height:62px;padding:0 14px}.topbar h1{font-size:16px}.content{padding:17px 14px 34px}.stats{gap:10px}.card{padding:14px;border-radius:13px}.stat-value{font-size:21px}.two-col{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}.top-actions .desktop-only{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.section-head{margin-top:19px}.toolbar{align-items:stretch}.search{max-width:none}.table-wrap{margin:0 -2px}.side-bottom{margin-top:20px}}
@media(max-width:380px){.stats{grid-template-columns:1fr 1fr}.stat-value{font-size:18px}.stat-icon{width:30px;height:30px}.btn{padding:8px 10px}.content{padding-left:10px;padding-right:10px}}
</style></head><body>
<div class="app"><aside class="sidebar" id="sidebar">
<div class="brand"><div class="brand-mark">K</div><div><strong>Digital Khata</strong><small>Business Manager</small></div></div>
<div><div class="nav-label">ACTIVE BUSINESS</div><select id="businessSelect" class="business-select" aria-label="Switch business"></select></div>
<div class="nav-label">WORKSPACE</div><nav class="nav" id="nav">
<button data-page="dashboard" class="active"><span class="ico">▦</span>Dashboard</button><button data-page="ledger"><span class="ico">▤</span>Khata Ledger</button><button data-page="customers"><span class="ico">♙</span>Customers</button><button data-page="suppliers"><span class="ico">♧</span>Suppliers</button><button data-page="payments"><span class="ico">₹</span>Payments</button><button data-page="invoices"><span class="ico">▧</span>Invoices & Sales</button><button data-page="inventory"><span class="ico">▣</span>Inventory</button><button data-page="expenses"><span class="ico">↘</span>Expenses</button><button data-page="reminders"><span class="ico">◷</span>Reminders</button><button data-page="reports"><span class="ico">▥</span>Reports</button></nav>
<div class="nav-label">PREFERENCES</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings & Backup</button></nav>
<div class="side-bottom">Your records stay in this browser.<br><b id="storageLabel">Local storage active</b><br>Export backups regularly.</div></aside>
<main class="main"><header class="topbar"><div class="top-left"><button class="btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div><h1 id="pageTitle">Dashboard</h1><div class="eyebrow" id="todayLabel"></div></div></div><div class="top-actions"><span class="pill green">● Local mode</span><button class="btn desktop-only" id="installBtn" hidden>＋ Install app</button><button class="btn primary" id="quickAddBtn">＋ Add entry</button></div></header><div class="content" id="view"></div></main></div>
<dialog class="modal" id="modal"><form id="modalForm"><div class="modal-head"><h2 id="modalTitle">Add</h2><button type="button" class="icon-btn" id="closeModal" aria-label="Close">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit" id="saveModal">Save</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='digitalKhata.v1',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),today=()=>new Date().toISOString().slice(0,10),money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({customers:[],suppliers:[],entries:[],products:[],invoices:[],expenses:[],reminders:[],settings:{businessName:'',phone:'',address:'',gstin:'',upi:'',lowStock:5,invoicePrefix:'INV'}});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.businesses)&&v.businesses.length)return v}catch(e){}const b={id:uid(),name:'My Business',data:blank()};return{version:1,active:b.id,businesses:[b]}}
let state=load(),page='dashboard',searchText='',modalAction=null,installPrompt=null;const current=()=>state.businesses.find(b=>b.id===state.active)||state.businesses[0],data=()=>current().data;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#storageLabel').textContent='Saved on this device';return true}catch(e){toast('Storage is full. Export a backup and remove large photos.');return false}}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2800)}
function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}
function parties(){return[...data().customers.map(x=>({...x,type:'customer'})),...data().suppliers.map(x=>({...x,type:'supplier'}))]}
function partyName(id){return parties().find(x=>x.id===id)?.name||'Unknown account'}
function balance(id){const supplier=data().suppliers.some(x=>x.id===id);return data().entries.filter(e=>e.partyId===id).reduce((s,e)=>s+(e.type==='credit'?(supplier?-e.amount:+e.amount):(supplier?+e.amount:-e.amount)),0)}
function sum(a,f){return a.reduce((s,x)=>s+f(x),0)}
function updateSelect(){$('#businessSelect').innerHTML=state.businesses.map(b=>'<option value="'+esc(b.id)+'" '+(b.id===state.active?'selected':'')+'>'+esc(b.name)+'</option>').join('')}
const titles={dashboard:'Dashboard',ledger:'Khata Ledger',customers:'Customers',suppliers:'Suppliers',payments:'Payments',invoices:'Invoices & Sales',inventory:'Inventory',expenses:'Expenses',reminders:'Payment Reminders',reports:'Reports & Analytics',settings:'Settings & Backup'};
function go(p){page=p;searchText='';$('#pageTitle').textContent=titles[p]||'Dashboard';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
function render(){updateSelect();$('#todayLabel').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+current().name;const map={dashboard,ledger:()=>partyTable('all'),customers:()=>partyTable('customer'),suppliers:()=>partyTable('supplier'),payments,invoices,inventory,expenses,reminders,reports,settings};$('#view').innerHTML=(map[page]||dashboard)();bindView()}
function stat(l,v,n,i){return'<div class="card"><div class="stat"><div><div class="stat-label">'+l+'</div><div class="stat-value">'+v+'</div><div class="stat-note">'+n+'</div></div><div class="stat-icon">'+i+'</div></div></div>'}
function quick(i,t,s,a){return'<button class="quick" data-action="'+a+'"><span>'+i+'</span><strong>'+t+'</strong><small>'+s+'</small></button>'}
function dashboard(){const d=data(),recv=sum(d.customers,c=>Math.max(0,balance(c.id))),pay=sum(d.suppliers,c=>Math.max(0,-balance(c.id))),sales=sum(d.invoices.filter(i=>i.status!=='cancelled'),i=>+i.total),paid=sum(d.entries.filter(e=>e.type==='payment'),e=>+e.amount),low=d.products.filter(p=>+p.stock<=+(d.settings.lowStock||5)),recent=[...d.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
return'<div class="grid stats">'+stat('Receivables',money(recv),'Customer outstanding','↗')+stat('Payables',money(pay),'Supplier balances','↘')+stat('Total sales',money(sales),'Recorded invoices','▧')+stat('Payments received',money(paid),'Recorded Jama entries','₹')+'</div><div class="section-head"><div><h2>Quick actions</h2><p>Common tasks for your business</p></div></div><div class="grid quick-grid">'+quick('＋','New khata entry','Record Udhaar or Jama','entry')+quick('♙','Add customer','Create a customer account','customer')+quick('▧','Create invoice','Prepare a customer bill','invoice')+quick('▣','Add product','Update inventory','product')+'</div><div class="grid two-col"><section><div class="section-head"><div><h2>Recent transactions</h2><p>Your latest ledger activity</p></div><button class="btn small" data-go="ledger">View ledger →</button></div><div class="card" style="padding:0"><div class="table-wrap" style="border:0"><table><thead><tr><th>Date</th><th>Account</th><th>Type</th><th>Amount</th></tr></thead><tbody>'+(recent.length?recent.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(partyName(e.partyId))+'</td><td><span class="pill '+(e.type==='credit'?'amber':'green')+'">'+(e.type==='credit'?'Udhaar':'Jama')+'</span></td><td class="amount">'+money(e.amount)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">No transactions yet. Add your first entry.</td></tr>')+'</tbody></table></div></div></section><section><div class="section-head"><div><h2>Stock alerts</h2><p>Items at or below minimum stock</p></div><button class="btn small" data-go="inventory">Inventory →</button></div><div class="card">'+(low.length?low.slice(0,5).map(p=>'<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><b>'+esc(p.name)+'</b><span class="pill red">'+p.stock+' '+esc(p.unit||'pcs')+'</span></div>').join(''):'<div class="empty"><strong>Stock looks good</strong>No low-stock items right now.</div>')+'</div><div class="section-head"><h2>Business snapshot</h2></div><div class="card"><div class="business-card"><div class="business-avatar">₹</div><div><b>'+esc(current().name)+'</b><div class="muted">'+d.customers.length+' customers · '+d.suppliers.length+' suppliers</div></div></div></div></section></div>'}
function toolbar(ph,btn,a){return'<div class="toolbar"><div class="search"><span>⌕</span><input id="tableSearch" placeholder="'+ph+'" value="'+esc(searchText)+'"></div><button class="btn primary" data-action="'+a+'">＋ '+btn+'</button></div>'}
function partyTable(type){const all=type==='all',list=all?parties():data()[type==='customer'?'customers':'suppliers'].map(x=>({...x,type})),filtered=list.filter(x=>(x.name+' '+(x.phone||'')+' '+(x.note||'')).toLowerCase().includes(searchText.toLowerCase()));return toolbar('Search name, phone or note…',all?'Add account':type==='customer'?'Add customer':'Add supplier',all?'party':type)+'<div class="table-wrap"><table><thead><tr><th>Account</th><th>Type</th><th>Phone</th><th>Balance</th><th>Actions</th></tr></thead><tbody>'+(filtered.length?filtered.map(x=>{const b=balance(x.id);return'<tr><td><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.note||'')+'</div></td><td><span class="pill">'+x.type+'</span></td><td>'+esc(x.phone||'—')+'</td><td class="amount '+(b>0?'negative':b<0?'positive':'')+'">'+money(Math.abs(b))+' '+(x.type==='supplier'?(b<0?'Payable':b>0?'Advance':'Settled'):(b>0?'Due':'Advance'))+'</td><td><button class="btn small" data-edit-party="'+x.id+'" data-type="'+x.type+'">Edit</button> <button class="btn small soft" data-ledger-party="'+x.id+'">Ledger</button></td></tr>'}).join(''):'<tr><td colspan="5" class="empty"><strong>No accounts found</strong>Add a customer or supplier to start tracking balances.</td></tr>')+'</tbody></table></div>'}
function payments(){const r=data().entries.filter(e=>e.type==='payment').sort((a,b)=>b.date.localeCompare(a.date));return'<div class="toolbar"><div><b>Payment history</b><div class="hint">Collections and supplier payments</div></div><button class="btn primary" data-action="payment">＋ Record payment</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Account</th><th>Mode</th><th>Reference</th><th>Amount</th><th>Note</th></tr></thead><tbody>'+(r.length?r.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(partyName(e.partyId))+'</td><td>'+esc(e.mode||'Cash')+'</td><td>'+esc(e.reference||'—')+'</td><td class="amount positive">'+money(e.amount)+'</td><td>'+esc(e.note||'')+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">No payments recorded.</td></tr>')+'</tbody></table></div><div class="notice" style="margin-top:14px">UPI payments are recorded manually. This static app cannot verify bank or UPI settlement.</div>'}
function invoices(){const r=[...data().invoices].sort((a,b)=>b.date.localeCompare(a.date));return'<div class="toolbar"><div><b>Sales invoices</b><div class="hint">GST and non-GST customer bills</div></div><button class="btn primary" data-action="invoice">＋ Create invoice</button></div><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Tax</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>'+(r.length?r.map(i=>'<tr><td><b>'+esc(i.number)+'</b></td><td>'+fmtDate(i.date)+'</td><td>'+esc(i.customerName)+'</td><td>'+money(i.tax)+'</td><td class="amount">'+money(i.total)+'</td><td><span class="pill '+(i.status==='cancelled'?'red':'green')+'">'+esc(i.status)+'</span></td><td><button class="btn small" data-print="'+i.id+'">Print / PDF</button></td></tr>').join(''):'<tr><td colspan="7" class="empty">No invoices created yet.</td></tr>')+'</tbody></table></div>'}
function inventory(){const r=data().products.filter(p=>(p.name+' '+(p.sku||'')).toLowerCase().includes(searchText.toLowerCase()));return toolbar('Search product or SKU…','Add product','product')+'<div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Purchase</th><th>Sale price</th><th>Stock</th><th>Stock value</th><th>Action</th></tr></thead><tbody>'+(r.length?r.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.sku||'—')+'</td><td>'+money(p.cost)+'</td><td>'+money(p.price)+'</td><td><span class="pill '+(p.stock<=data().settings.lowStock?'red':'green')+'">'+p.stock+' '+esc(p.unit||'pcs')+'</span></td><td>'+money(p.stock*p.cost)+'</td><td><button class="btn small" data-stock="'+p.id+'">Adjust</button> <button class="btn small" data-edit-product="'+p.id+'">Edit</button></td></tr>').join(''):'<tr><td colspan="7" class="empty">No products found. Add your first product.</td></tr>')+'</tbody></table></div>'}
function expenses(){const r=[...data().expenses].sort((a,b)=>b.date.localeCompare(a.date));return'<div class="toolbar"><div><b>Business expenses</b><div class="hint">Track operating costs</div></div><button class="btn primary" data-action="expense">＋ Add expense</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Mode</th><th>Amount</th></tr></thead><tbody>'+(r.length?r.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.note||'—')+'</td><td>'+esc(e.mode||'Cash')+'</td><td class="amount negative">'+money(e.amount)+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">No expenses recorded.</td></tr>')+'</tbody></table></div>'}

function reports(){const d=data(),credit=sum(d.entries.filter(e=>e.type==='credit'),e=>+e.amount),jama=sum(d.entries.filter(e=>e.type==='payment'),e=>+e.amount),sales=sum(d.invoices.filter(i=>i.status!=='cancelled'),i=>+i.total),expense=sum(d.expenses,e=>+e.amount),pay=sum(d.suppliers,s=>Math.max(0,-balance(s.id))),top=d.customers.map(c=>({name:c.name,b:balance(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,8);return'<div class="grid stats">'+stat('Udhaar recorded',money(credit),'Credit entries','↗')+stat('Jama recorded',money(jama),'Payment entries','₹')+stat('Expenses',money(expense),'Recorded expenses','↘')+stat('Estimated net',money(sales-expense),'Sales less expenses','∑')+'</div><div class="grid two-col"><div class="card"><h2 style="font-size:14px">Outstanding by customer</h2>'+(top.length?top.map(x=>'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>'+esc(x.name)+'</span><b>'+money(x.b)+'</b></div>').join(''):'<div class="empty">No customer outstanding.</div>')+'</div><div class="card"><h2 style="font-size:14px">Business totals</h2>'+[['Invoice sales',sales],['Customer Udhaar',credit],['Jama received',jama],['Supplier payable',pay],['Expenses',expense]].map(x=>'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span class="muted">'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'<button class="btn" style="margin-top:14px" data-export="csv">↓ Export transactions CSV</button></div></div>'}
function settings(){const s=data().settings;return'<div class="grid two-col"><section class="card"><h2 style="font-size:14px">Business profile</h2><form id="profileForm" class="form-grid">'+field('Business name','businessName',{value:s.businessName||current().name,required:true,full:true})+field('Phone','phone',{value:s.phone})+field('GSTIN','gstin',{value:s.gstin})+field('Business address','address',{type:'textarea',value:s.address,full:true})+field('UPI ID','upi',{value:s.upi,placeholder:'name@bank'})+field('Low-stock threshold','lowStock',{type:'number',min:0,value:s.lowStock||5})+field('Invoice prefix','invoicePrefix',{value:s.invoicePrefix||'INV'})+'<div class="field" style="align-content:end"><button class="btn primary">Save profile</button></div></form></section><section class="card"><h2 style="font-size:14px">Business management</h2><p class="hint">Each business has independent customers, ledgers, invoices, expenses and inventory.</p><div class="actions" style="margin:15px 0"><button class="btn primary" data-action="business">＋ Add business</button><button class="btn" data-action="rename-business">Rename current</button></div><div class="notice warn">LocalStorage is not encrypted and does not provide separate staff logins.</div><h2 style="font-size:14px;margin-top:20px">Data backup</h2><div class="actions"><button class="btn primary" data-export="all">↓ Backup all businesses</button><button class="btn" data-export="current">↓ Current business</button><button class="btn" data-action="import">↑ Restore backup</button></div><p class="hint">Backup files contain your business data. Store them privately.</p><button class="btn danger" style="margin-top:12px" data-action="clear">Clear current business data</button></section></div><div class="card" style="margin-top:16px"><h2 style="font-size:14px">Storage & privacy</h2><p class="hint">Records are saved in this browser on this device. They do not sync to other devices. Clearing browser data or changing browsers may remove records. Export JSON backups regularly. This app does not send UPI payments, verify settlements or automatically send SMS/WhatsApp reminders.</p><p class="hint">Bookkeeping assistance only; verify GST and accounting requirements with a qualified professional.</p></div>'}
function field(label,name,o={}){const t=o.type||'text',v=o.value??'',req=o.required?'required':'';let el=o.options?'<select name="'+name+'" '+req+'>'+o.options.map(x=>'<option value="'+esc(x.value)+'" '+(String(x.value)===String(v)?'selected':'')+'>'+esc(x.label)+'</option>').join('')+'</select>':t==='textarea'?'<textarea name="'+name+'" '+req+'>'+esc(v)+'</textarea>':'<input name="'+name+'" type="'+t+'" '+(o.min!==undefined?'min="'+o.min+'"':'')+' '+(o.step?'step="'+o.step+'"':'')+' '+req+' value="'+esc(v)+'" placeholder="'+esc(o.placeholder||'')+'">';return'<div class="field '+(o.full?'full':'')+'"><label>'+label+'</label>'+el+'</div>'}
function openModal(title,html,fn,save='Save'){modalAction=fn;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#saveModal').textContent=save;$('#modal').showModal()}
function closeModal(){$('#modal').close();modalAction=null}
function openParty(type,id){const list=data()[type==='supplier'?'suppliers':'customers'],old=list.find(x=>x.id===id)||{};openModal((id?'Edit ':'Add ')+type,'<div class="form-grid">'+field('Name','name',{value:old.name,required:true,full:true})+field('Phone','phone',{value:old.phone})+field('Email','email',{type:'email',value:old.email})+field('Address','address',{value:old.address,full:true})+field('Notes','note',{type:'textarea',value:old.note,full:true})+'</div>',f=>{const x={...old,id:old.id||uid(),name:f.get('name').trim(),phone:f.get('phone'),email:f.get('email'),address:f.get('address'),note:f.get('note')};if(!x.name)return;const i=list.findIndex(p=>p.id===x.id);if(i<0)list.push(x);else list[i]=x;persist();closeModal();render();toast('Account saved')})}
function openEntry(id){const ps=parties();if(!ps.length)return toast('Add a customer or supplier first');openModal('Record khata entry','<div class="form-grid">'+field('Account','partyId',{required:true,value:id||'',options:ps.map(p=>({value:p.id,label:p.name+' ('+p.type+')'})),full:true})+field('Entry type','type',{value:'credit',options:[{value:'credit',label:'Udhaar — credit / amount due'},{value:'payment',label:'Jama — payment received / paid'}]})+field('Amount (₹)','amount',{type:'number',min:'.01',step:'.01',required:true})+field('Date','date',{type:'date',value:today(),required:true})+field('Payment mode','mode',{options:['Cash','UPI','Bank transfer','Cheque','Other'].map(x=>({value:x,label:x}))})+field('Reference / note','note',{full:true})+'</div><p class="hint">For customer accounts, Udhaar increases the due balance and Jama reduces it. For suppliers, record purchases as Udhaar and payments as Jama.</p>',f=>{const a=+f.get('amount');if(a<=0||!f.get('partyId'))return toast('Enter a valid account and amount');data().entries.push({id:uid(),partyId:f.get('partyId'),type:f.get('type'),amount:a,date:f.get('date'),mode:f.get('mode'),note:f.get('note')});persist();closeModal();render();toast('Transaction saved')})}
function openProduct(id){const list=data().products,o=list.find(x=>x.id===id)||{};openModal(id?'Edit product':'Add product','<div class="form-grid">'+field('Product name','name',{value:o.name,required:true,full:true})+field('SKU / code','sku',{value:o.sku})+field('Unit','unit',{value:o.unit||'pcs'})+field('Purchase price','cost',{type:'number',min:0,step:'.01',value:o.cost||0})+field('Sale price','price',{type:'number',min:0,step:'.01',value:o.price||0})+field('Opening stock','stock',{type:'number',min:0,step:'.01',value:o.stock||0})+'</div>',f=>{const x={...o,id:o.id||uid(),name:f.get('name').trim(),sku:f.get('sku'),unit:f.get('unit'),cost:+f.get('cost'),price:+f.get('price'),stock:+f.get('stock')};if(!x.name)return;const i=list.findIndex(p=>p.id===x.id);if(i<0)list.push(x);else list[i]=x;persist();closeModal();render();toast('Product saved')})}
function adjustStock(id){const p=data().products.find(x=>x.id===id);if(!p)return;openModal('Adjust stock — '+p.name,'<div class="form-grid">'+field('Adjustment','direction',{options:[{value:'add',label:'Add stock'},{value:'remove',label:'Remove stock'}]})+field('Quantity','qty',{type:'number',min:'.01',step:'.01',required:true})+field('Reason','reason',{full:true})+'</div><p class="hint">Current stock: '+p.stock+' '+esc(p.unit)+'</p>',f=>{const q=+f.get('qty');if(q<=0||(f.get('direction')==='remove'&&q>p.stock))return toast('Invalid quantity or insufficient stock');p.stock+=f.get('direction')==='add'?q:-q;persist();closeModal();render();toast('Stock adjusted')})}
function openInvoice(){const cs=data().customers,ps=data().products;if(!cs.length)return toast('Add a customer first');openModal('Create sales invoice','<div class="form-grid">'+field('Customer','customerId',{required:true,full:true,options:cs.map(c=>({value:c.id,label:c.name}))})+field('Invoice date','date',{type:'date',value:today(),required:true})+field('Invoice type','taxMode',{options:[{value:'gst',label:'GST invoice'},{value:'non-gst',label:'Non-GST invoice'}]})+field('Place of supply / state','place')+field('Product','productId',{options:[{value:'',label:'Custom item / service'},...ps.map(p=>({value:p.id,label:p.name+' — '+money(p.price)}))]})+field('Description','itemName',{placeholder:'Item or service name'})+field('Quantity','qty',{type:'number',min:'.01',step:'.01',value:1})+field('Rate (₹)','rate',{type:'number',min:0,step:'.01',value:0})+field('GST rate (%)','gst',{type:'number',min:0,max:100,step:'.01',value:18})+field('Discount (₹)','discount',{type:'number',min:0,step:'.01',value:0})+'</div><p class="hint">Single line-item invoice. For GST invoices, tax is calculated on the discounted taxable value.</p>',f=>{const c=cs.find(x=>x.id===f.get('customerId')),p=ps.find(x=>x.id===f.get('productId')),qty=+f.get('qty'),rate=+f.get('rate'),base=Math.max(0,qty*rate-(+f.get('discount'))),gst=f.get('taxMode')==='gst'?+f.get('gst'):0,tax=base*gst/100,total=base+tax;if(!c||qty<=0||rate<0)return toast('Check customer, quantity and rate');const num=(data().settings.invoicePrefix||'INV')+'-'+String(data().invoices.length+1).padStart(4,'0'),inv={id:uid(),number:num,date:f.get('date'),customerId:c.id,customerName:c.name,taxMode:f.get('taxMode'),place:f.get('place'),itemName:f.get('itemName')||p?.name||'Item / service',qty,rate,discount:+f.get('discount'),taxRate:gst,tax,total,status:'unpaid'};data().invoices.push(inv);data().entries.push({id:uid(),partyId:c.id,type:'credit',amount:total,date:inv.date,mode:'Invoice',note:'Invoice '+num,invoiceId:inv.id});if(p)p.stock=Math.max(0,p.stock-qty);persist();closeModal();render();printInvoice(inv.id)})}
function printInvoice(id){const i=data().invoices.find(x=>x.id===id);if(!i)return;const s=data().settings,w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print invoice');w.document.write('<!doctype html><html><head><title>'+esc(i.number)+'</title><style>body{font:14px Arial;color:#222;margin:40px}h1{font-size:22px}table{width:100%;border-collapse:collapse;margin-top:30px}td,th{padding:12px;border:1px solid #ddd;text-align:left}.right{text-align:right}.muted{color:#666}</style></head><body><h1>'+esc(s.businessName||current().name)+'</h1><p>'+esc(s.address||'')+'<br>'+esc(s.phone||'')+' · GSTIN: '+esc(s.gstin||'—')+'</p><hr><h2>INVOICE '+esc(i.number)+'</h2><p>Date: '+fmtDate(i.date)+'<br>Bill to: <b>'+esc(i.customerName)+'</b></p><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Tax</th><th>Total</th></tr><tr><td>'+esc(i.itemName)+'</td><td>'+i.qty+'</td><td>'+money(i.rate)+'</td><td>'+money(i.tax)+'</td><td>'+money(i.total)+'</td></tr></table><h2 class="right">Grand total: '+money(i.total)+'</h2><p class="muted">Computer-generated invoice. Verify applicable tax details before issuing.</p><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()}
function openExpense(){openModal('Add expense','<div class="form-grid">'+field('Date','date',{type:'date',value:today(),required:true})+field('Category','category',{options:['Rent','Salary','Utilities','Travel','Purchase','Maintenance','Other'].map(x=>({value:x,label:x}))})+field('Amount (₹)','amount',{type:'number',min:'.01',step:'.01',required:true})+field('Payment mode','mode',{options:['Cash','UPI','Bank transfer','Card','Other'].map(x=>({value:x,label:x}))})+field('Description','note',{full:true})+'</div>',f=>{if(+f.get('amount')<=0)return;data().expenses.push({id:uid(),date:f.get('date'),category:f.get('category'),amount:+f.get('amount'),mode:f.get('mode'),note:f.get('note')});persist();closeModal();render();toast('Expense saved')})}
function openReminder(){const cs=data().customers;if(!cs.length)return toast('Add a customer first');openModal('Create payment reminder','<div class="form-grid">'+field('Customer','partyId',{required:true,full:true,options:cs.map(x=>({value:x.id,label:x.name}))})+field('Reminder date','date',{type:'date',value:today(),required:true})+field('Amount due (₹)','amount',{type:'number',min:'.01',step:'.01',required:true})+field('Message','message',{full:true,value:'Kindly clear your pending payment. Thank you.'})+'</div>',f=>{data().reminders.push({id:uid(),partyId:f.get('partyId'),date:f.get('date'),amount:+f.get('amount'),message:f.get('message')});persist();closeModal();render();toast('Reminder saved')})}
function shareReminder(id){const r=data().reminders.find(x=>x.id===id),p=parties().find(x=>x.id===r?.partyId);if(!r||!p)return;const msg='Hello '+p.name+', this is a friendly reminder about your pending payment of '+money(r.amount)+'. '+(r.message||'Thank you.');window.open('https://wa.me/'+String(p.phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank','noopener')}
function addBusiness(){openModal('Add a business','<div class="form-grid">'+field('Business name','name',{required:true,full:true})+field('Business type','type',{options:['Retail','Wholesale','Services','Manufacturing','Other'].map(x=>({value:x,label:x}))})+'</div>',f=>{const name=f.get('name').trim();if(!name)return;const b={id:uid(),name,data:blank()};b.data.settings.businessName=name;state.businesses.push(b);state.active=b.id;persist();closeModal();go('dashboard');toast('Business created')})}
function renameBusiness(){openModal('Rename business','<div class="form-grid">'+field('Business name','name',{value:current().name,required:true,full:true})+'</div>',f=>{current().name=f.get('name').trim();data().settings.businessName=current().name;persist();closeModal();render();toast('Business renamed')})}
function clearBusiness(){openModal('Clear business data?','<div class="notice warn">This permanently removes all records for <b>'+esc(current().name)+'</b> from this browser. Export a backup first.</div><div class="field" style="margin-top:14px"><label>Type CLEAR to confirm</label><input name="confirm" required></div>',f=>{if(f.get('confirm')!=='CLEAR')return toast('Confirmation text did not match');current().data=blank();persist();closeModal();render();toast('Business data cleared')},'Clear data')}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportData(which){const obj=which==='all'?state:{version:1,active:current().id,businesses:[current()]};download('digital-khata-'+(which==='all'?'all-businesses':current().name.toLowerCase().replace(/[^a-z0-9]+/g,'-'))+'-'+today()+'.json',JSON.stringify(obj,null,2),'application/json');toast('Backup downloaded')}
function exportCsv(){const rows=[['Date','Account','Type','Amount','Mode','Note'],...data().entries.map(e=>[e.date,partyName(e.partyId),e.type,e.amount,e.mode||'',e.note||''])];download('khata-transactions-'+today()+'.csv',rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8')}
function importBackup(){openModal('Restore backup','<div class="field full"><label>Choose a Digital Khata JSON backup</label><input type="file" name="backup" accept=".json,application/json" required></div><div class="notice warn" style="margin-top:12px">Restore replaces all current businesses. Export current data first.</div>',async f=>{try{const obj=JSON.parse(await f.get('backup').text());if(!Array.isArray(obj.businesses)||!obj.businesses.length||obj.businesses.some(b=>!b.id||!b.data))throw Error('bad');if(!confirm('Replace all current business data with this backup?'))return;state=obj;state.active=state.businesses.some(b=>b.id===obj.active)?obj.active:state.businesses[0].id;persist();closeModal();render();toast('Backup restored')}catch(e){toast('Invalid backup file')}})}
function renderLedgerParty(id){const rows=data().entries.filter(e=>e.partyId===id).sort((a,b)=>a.date.localeCompare(b.date));let bal=0;$('#view').innerHTML='<div class="toolbar"><div><b>'+esc(partyName(id))+'</b><div class="hint">Account transaction history</div></div><button class="btn primary" id="ledgerAdd">＋ Add entry</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Details</th><th>Amount</th><th>Running balance</th><th>Actions</th></tr></thead><tbody>'+(rows.map(e=>{bal+=e.type==='credit'?+e.amount:-e.amount;return'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.note||'')+'</td><td>'+money(e.amount)+'</td><td class="amount">'+money(bal)+'</td><td><button class="btn small" data-edit-entry="'+e.id+'">Edit</button> <button class="btn small danger" data-delete-entry="'+e.id+'">Delete</button></td></tr>'}).join('')||'<tr><td colspan="5" class="empty">No entries for this account.</td></tr>')+'</tbody></table></div><button class="btn" style="margin-top:14px" id="ledgerBack">← Back to accounts</button>';$('#ledgerAdd').onclick=()=>openEntry(id);$('#ledgerBack').onclick=()=>go('ledger')}
function editEntry(id){const e=data().entries.find(x=>x.id===id);if(!e)return;const ps=parties();openModal('Edit transaction','<div class="form-grid">'+field('Account','partyId',{required:true,value:e.partyId,options:ps.map(p=>({value:p.id,label:p.name+' ('+p.type+')'})),full:true})+field('Entry type','type',{value:e.type,options:[{value:'credit',label:'Udhaar / credit'},{value:'payment',label:'Jama / payment'}]})+field('Amount (₹)','amount',{type:'number',min:'.01',step:'.01',required:true,value:e.amount})+field('Date','date',{type:'date',value:e.date,required:true})+field('Payment mode','mode',{value:e.mode||'Cash',options:['Cash','UPI','Bank transfer','Cheque','Other'].map(x=>({value:x,label:x}))})+field('Reference / note','note',{value:e.note||'',full:true})+'</div>',f=>{const amount=+f.get('amount');if(amount<=0)return toast('Enter a valid amount');Object.assign(e,{partyId:f.get('partyId'),type:f.get('type'),amount,date:f.get('date'),mode:f.get('mode'),note:f.get('note')});persist();closeModal();renderLedgerParty(e.partyId);toast('Transaction updated')})}
function deleteEntry(id){const e=data().entries.find(x=>x.id===id);if(!e||!confirm('Delete this transaction? The account balance will be recalculated.'))return;data().entries=data().entries.filter(x=>x.id!==id);persist();renderLedgerParty(e.partyId);toast('Transaction deleted')}
function action(a){({party:()=>openParty('customer'),customer:()=>openParty('customer'),supplier:()=>openParty('supplier'),entry:()=>openEntry(),payment:()=>openEntry(),product:()=>openProduct(),invoice:openInvoice,expense:openExpense,reminder:openReminder,business:addBusiness,'rename-business':renameBusiness,import:importBackup,clear:clearBusiness})[a]?.()}
function bindView(){const s=$('#tableSearch');if(s)s.addEventListener('input',e=>{searchText=e.target.value;const pos=e.target.selectionStart;render();const n=$('#tableSearch');n.focus();n.setSelectionRange(pos,pos)});const product=$('[name=productId]'),rate=$('[name=rate]'),desc=$('[name=itemName]');if(product&&rate)product.addEventListener('change',()=>{const p=data().products.find(x=>x.id===product.value);if(p){rate.value=p.price;if(desc&&!desc.value)desc.value=p.name}})}
function bindEvents(){document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){go(n.dataset.page);return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const ep=e.target.closest('[data-edit-party]');if(ep){openParty(ep.dataset.type,ep.dataset.editParty);return}const lp=e.target.closest('[data-ledger-party]');if(lp){renderLedgerParty(lp.dataset.ledgerParty);return}const pr=e.target.closest('[data-print]');if(pr){printInvoice(pr.dataset.print);return}const sr=e.target.closest('[data-share-reminder]');if(sr){shareReminder(sr.dataset.shareReminder);return}const ex=e.target.closest('[data-export]');if(ex){ex.dataset.export==='csv'?exportCsv():exportData(ex.dataset.export);return}const st=e.target.closest('[data-stock]');if(st){adjustStock(st.dataset.stock);return}const epd=e.target.closest('[data-edit-product]');if(epd){openProduct(epd.dataset.editProduct);return}const ee=e.target.closest('[data-edit-entry]');if(ee){editEntry(ee.dataset.editEntry);return}const de=e.target.closest('[data-delete-entry]');if(de)deleteEntry(de.dataset.deleteEntry)});
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();if(modalAction)modalAction(new FormData(e.currentTarget))});$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#businessSelect').onchange=e=>{state.active=e.target.value;persist();go('dashboard')};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#quickAddBtn').onclick=()=>openEntry();$('#view').addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();const f=new FormData(e.target);data().settings=Object.fromEntries(f.entries());current().name=data().settings.businessName||current().name;persist();render();toast('Business profile saved')}})}
bindEvents();window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render();toast('Data updated in another tab')}});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').hidden=false});$('#installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').hidden=true}};if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));updateSelect();render();
})();
</script></body></html>
