xt-align:left;padding:12px 14px;border-bottom:1px solid #edf0f4}th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#8590a0;background:#fafbfd}td{font-size:12px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcfe}.amount{font-weight:750;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--red)}.muted{color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#f0f2f5;color:#5f6978;font-size:10px;font-weight:750}.pill.green{background:#e6f6ef;color:#13734e}.pill.red{background:#fff0f0;color:#b13c3c}.pill.amber{background:#fff4df;color:#96600e}.empty{text-align:center;padding:34px 12px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#596576}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #dfe4eb;border-radius:9px;background:#fff;color:var(--ink);min-height:40px}.field textarea{min-height:76px;resize:vertical}.hint{font-size:10px;color:var(--muted);line-height:1.5}.modal{border:0;border-radius:18px;padding:0;width:min(620px,calc(100vw - 24px));max-height:90vh;box-shadow:0 24px 90px #10182844}.modal::backdrop{background:#15203366;backdrop-filter:blur(3px)}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:16px;margin:0}.modal-body{padding:20px 22px;overflow:auto;max-height:calc(90vh - 135px)}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.icon-btn{border:0;background:transparent;font-size:20px;color:var(--muted);padding:4px 8px}.notice{padding:12px 14px;border-radius:11px;background:#f1f5ff;color:#36549b;font-size:12px;line-height:1.5}.notice.warn{background:#fff6e6;color:#88580d}.quick-grid{grid-template-columns:repeat(4,1fr)}.quick{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;text-align:left;display:grid;gap:9px;color:var(--ink)}.quick:hover{border-color:#b7c8fa;background:#fbfcff}.quick span:first-child{font-size:19px}.quick strong{font-size:12px}.quick small{font-size:10px;color:var(--muted)}.mobile-menu{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172333;color:white;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:30;font-size:12px}.hidden{display:none!important}.business-card{display:flex;align-items:center;gap:12px}.business-avatar{width:42px;height:42px;border-radius:13px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.progress{height:7px;border-radius:9px;background:#edf0f5;overflow:hidden}.progress i{display:block;height:100%;background:#6f91e8;border-radius:9px}.footer-note{text-align:center;color:#9aa3b0;font-size:10px;padding:25px 0 0}

@media(max-width:380px){.stats{grid-template-columns:1fr 1fr}.stat-value{font-size:18px}.stat-icon{width:30px;height:30px}.btn{padding:8px 10px}.content{padding-left:10px;padding-right:10px}}
\n.invoice-rows{display:grid;gap:8px}.invoice-row{display:grid;grid-template-columns:1.25fr 1.2fr .65fr .8fr .65fr 36px;gap:6px;align-items:center;margin-bottom:7px}.invoice-row input,.invoice-row select{min-width:0;width:100%;padding:9px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:12px}.report-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.report-row:last-child{border-bottom:0}.actions{display:flex;flex-wrap:wrap;gap:7px}[data-theme=dark]{--bg:#111827;--panel:#1c2736;--ink:#edf2f8;--muted:#a6b2c2;--line:#344254;--blue:#7ea5ff;--blue2:#263b60;--shadow:0 8px 28px #0003}[data-theme=dark] .sidebar,[data-theme=dark] .topbar,[data-theme=dark] .table-wrap,[data-theme=dark] .btn,[data-theme=dark] .quick{background:var(--panel);color:var(--ink)}[data-theme=dark] .business-select,[data-theme=dark] .field input,[data-theme=dark] .field select,[data-theme=dark] .field textarea,[data-theme=dark] .search input{background:#111b29;color:var(--ink);border-color:var(--line)}[data-theme=dark] th{background:#202d3e;color:#bac6d6}[data-theme=dark] tbody tr:hover{background:#253348}.btn:focus-visible,.nav button:focus-visible{outline:3px solid #8eafff;outline-offset:2px}@media(max-width:760px){.invoice-row{grid-template-columns:1fr 1fr 1fr}.invoice-row [name=itemName]{grid-column:span 2}.invoice-row [name=itemProduct]{grid-column:span 3}.invoice-row button{grid-column:3}.invoice-row input,.invoice-row select{min-height:42px}}</style></head><body>
<div class="app"><aside class="sidebar" id="sidebar">
<div class="brand"><div class="brand-mark">K</div><div><strong>Digital Khata</strong><small>Business Manager</small></div></div>
<div><div class="nav-label">ACTIVE BUSINESS</div><select id="businessSelect" class="business-select" aria-label="Switch business"></select></div>
<div class="nav-label">WORKSPACE</div><nav class="nav" id="nav">
<button data-page="dashboard" class="active"><span class="ico">▦</span>Dashboard</button><button data-page="ledger"><span class="ico">▤</span>Khata Ledger</button><button data-page="customers"><span class="ico">♙</span>Customers</button><button data-page="suppliers"><span class="ico">♧</span>Suppliers</button><button data-page="payments"><span class="ico">₹</span>Payments</button><button data-page="invoices"><span class="ico">▧</span>Invoices & Sales</button><button data-page="inventory"><span class="ico">▣</span>Inventory</button><button data-page="purchases"><span class="ico">▧</span>Purchases</button><button data-page="cashbook"><span class="ico">₹</span>Cashbook</button><button data-page="returns"><span class="ico">↩</span>Returns</button><button data-page="stockHistory"><span class="ico">↕</span>Stock History</button><button data-page="expenses"><span class="ico">↘</span>Expenses</button><button data-page="reminders"><span class="ico">◷</span>Reminders</button><button data-page="reports"><span class="ico">▥</span>Reports</button></nav>
<div class="nav-label">PREFERENCES</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings & Backup</button></nav>
<div class="side-bottom">Your records stay in this browser.<br><b id="storageLabel">Local storage active</b><br>Export backups regularly.</div></aside>
<main class="main"><header class="topbar"><div class="top-left"><button class="btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div><h1 id="pageTitle">Dashboard</h1><div class="eyebrow" id="todayLabel"></div></div></div><div class="top-actions"><span class="pill green">● Local mode</span><button class="btn desktop-only" id="installBtn" hidden>＋ Install app</button><button class="btn primary" id="quickAddBtn">＋ Add entry</button></div></header><div class="content" id="view"></div></main></div>
<dialog class="modal" id="modal"><form id="modalForm"><div class="modal-head"><h2 id="modalTitle">Add</h2><button type="button" class="icon-btn" id="closeModal" aria-label="Close">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit" id="saveModal">Save</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='digitalKhata.v1',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),today=()=>new Date().toISOString().slice(0,10),money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({customers:[],suppliers:[],entries:[],products:[],invoices:[],expenses:[],reminders:[],purchases:[],returns:[],stockMoves:[],settings:{businessName:'',phone:'',address:'',gstin:'',upi:'',lowStock:5,invoicePrefix:'INV',theme:'light',language:'en',invoiceTemplate:'standard'}});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.businesses)&&v.businesses.length)return normalizeState(v)}catch(e){try{const b=JSON.parse(localStorage.getItem('digitalKhata.recovery.v1'));if(b)return normalizeState(b)}catch(_){}}const b={id:uid(),name:'My Business',data:blank()};return normalizeState({version:2,active:b.id,businesses:[b]})}
let state=load(),page='dashboard',searchText='',modalAction=null,installPrompt=null;const current=()=>state.businesses.find(b=>b.id===state.active)||state.businesses[0],data=()=>current().data;
function persist(){try{const next=JSON.stringify(state),previous=localStorage.getItem(KEY);if(previous&&previous!==next)localStorage.setItem('digitalKhata.recovery.v1',previous);localStorage.setItem(KEY,next);$('#storageLabel').textContent='Saved · '+storageInfo().kb+' KB';return true}catch(e){toast('Could not save: storage is full. Export a backup and clear unused browser data.');return false}}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2800)}
function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}
function parties(){return[...data().customers.map(x=>({...x,type:'customer'})),...data().suppliers.map(x=>({...x,type:'supplier'}))]}
function partyName(id){return parties().find(x=>x.id===id)?.name||'Unknown account'}
function balance(id){const supplier=data().suppliers.some(x=>x.id===id);return data().entries.filter(e=>e.partyId===id).reduce((s,e)=>s+(e.type==='credit'?(supplier?-e.amount:+e.amount):(supplier?+e.amount:-e.amount)),0)}
function sum(a,f){return a.reduce((s,x)=>s+f(x),0)}
function updateSelect(){$('#businessSelect').innerHTML=state.businesses.map(b=>'<option value="'+esc(b.id)+'" '+(b.id===state.active?'selected':'')+'>'+esc(b.name)+'</option>').join('')}
const titles={dashboard:'Dashboard',ledger:'Khata Ledger',customers:'Customers',suppliers:'Suppliers',payments:'Payments',invoices:'Invoices & Sales',inventory:'Inventory',purchases:'Purchases',cashbook:'Cashbook',returns:'Returns',stockHistory:'Stock History',expenses:'Expenses',reminders:'Payment Reminders',reports:'Reports & Analytics',settings:'Settings & Backup'};
function go(p){page=p;searchText='';$('#pageTitle').textContent=titles[p]||'Dashboard';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
function render(){applyTheme();updateSelect();$('#todayLabel').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+current().name;const map={dashboard,ledger:()=>partyTable('all'),customers:()=>partyTable('customer'),suppliers:()=>partyTable('supplier'),payments,invoices,inventory,purchases,cashbook,returns,stockHistory,expenses,reminders,reports,settings};$('#view').innerHTML=(map[page]||dashboard)();bindView();applyLanguage()}
function stat(l,v,n,i){return'<div class="card"><div class="stat"><div><div class="stat-label">'+l+'</div><div class="stat-value">'+v+'</div><div class="stat-note">'+n+'</div></div><div class="stat-icon">'+i+'</div></div></div>'}
function quick(i,t,s,a){return'<button class="quick" data-action="'+a+'"><span>'+i+'</span><strong>'+t+'</strong><small>'+s+'</small></button>'}
function dashboard(){const d=data(),recv=sum(d.customers,c=>Math.max(0,balance(c.id))),pay=sum(d.suppliers,c=>Math.max(0,-balance(c.id))),sales=sum(d.invoices.filter(i=>i.status!=='cancelled'),i=>+i.total),paid=sum(d.entries.filter(e=>e.type==='payment'),e=>+e.amount),low=d.products.filter(p=>+p.stock<=+(d.settings.lowStock||5)),recent=[...d.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
return'<div class="grid stats">'+stat('Receivables',money(recv),'Customer outstanding','↗')+stat('Payables',money(pay),'Supplier balances','↘')+stat('Total sales',money(sales),'Recorded invoices','▧')+stat('Payments received',money(paid),'Recorded Jama entries','₹')+'</div><div class="section-head"><div><h2>Quick actions</h2><p>Common tasks for your business</p></div></div><div class="grid quick-grid">'+quick('＋','New khata entry','Record Udhaar or Jama','entry')+quick('♙','Add customer','Create a customer account','customer')+quick('▧','Create invoice','Prepare a customer bill','invoice')+quick('▣','Add product','Update inventory','product')+'</div><div class="grid two-col"><section><div class="section-head"><div><h2>Recent transactions</h2><p>Your latest ledger activity</p></div><button class="btn small" data-go="ledger">View ledger →</button></div><div class="card" style="padding:0"><div class="table-wrap" style="border:0"><table><thead><tr><th>Date</th><th>Account</th><th>Type</th><th>Amount</th></tr></thead><tbody>'+(recent.length?recent.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(partyName(e.partyId))+'</td><td><span class="pill '+(e.type==='credit'?'amber':'green')+'">'+(e.type==='credit'?'Udhaar':'Jama')+'</span></td><td class="amount">'+money(e.amount)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">No transactions yet. Add your first entry.</td></tr>')+'</tbody></table></div></div></section><section><div class="section-head"><div><h2>Stock alerts</h2><p>Items at or below minimum stock</p></div><button class="btn small" data-go="inventory">Inventory →</button></div><div class="card">'+(low.length?low.slice(0,5).map(p=>'<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><b>'+esc(p.name)+'</b><span class="pill red">'+p.stock+' '+esc(p.unit||'pcs')+'</span></div>').join(''):'<div class="empty"><strong>Stock looks good</strong>No low-stock items right now.</div>')+'</div><div class="section-head"><h2>Business snapshot</h2></div><div class="card"><div class="business-card"><div class="business-avatar">₹</div><div><b>'+esc(current().name)+'</b><div class="muted">'+d.customers.length+' customers · '+d.suppliers.length+' suppliers</div></div></div></div></section></div>'}
function toolbar(ph,btn,a){return'<div class="toolbar"><div class="search"><span>⌕</span><input id="tableSearch" placeholder="'+ph+'" value="'+esc(searchText)+'"></div><button class="btn primary" data-action="'+a+'">＋ '+btn+'</button></div>'}
function partyTable(type){const all=type==='all',list=all?parties():data()[type==='customer'?'customers':'suppliers'].map(x=>({...x,type})),filtered=list.filter(x=>(x.name+' '+(x.phone||'')+' '+(x.note||'')).toLowerCase().includes(searchText.toLowerCase()));return toolbar('Search name, phone or note…',all?'Add account':type==='customer'?'Add customer':'Add supplier',all?'party':type)+'<div class="table-wrap"><table><thead><tr><th>Account</th><th>Type</th><th>Phone</th><th>Balance</th><th>Actions</th></tr></thead><tbody>'+(filtered.length?filtered.map(x=>{const b=balance(x.id);return'<tr><td><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.note||'')+'</div></td><td><span class="pill">'+x.type+'</span></td><td>'+esc(x.phone||'—')+'</td><td class="amount '+(b>0?'negative':b<0?'positive':'')+'">'+money(Math.abs(b))+' '+(x.type==='supplier'?(b<0?'Payable':b>0?'Advance':'Settled'):(b>0?'Due':'Advance'))+'</td><td><button class="btn small" data-edit-party="'+x.id+'" data-type="'+x.type+'">Edit</button> <button class="btn small soft" data-ledger-party="'+x.id+'">Ledger</button></td></tr>'}).join(''):'<tr><td colspan="5" class="empty"><strong>No accounts found</strong>Add a customer or supplier to start tracking balances.</td></tr>')+'</tbody></table></div>'}
function payments(){const r=data().entries.filter(e=>e.type==='payment').sort((a,b)=>b.date.localeCompare(a.date));return'<div class="toolbar"><div><b>Payment history</b><div class="hint">Collections and supplier payments</div></div><button class="btn primary" data-action="payment">＋ Record payment</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Account</th><th>Mode</th><th>Reference</th><th>Amount</th><th>Note</th></tr></thead><tbody>'+(r.length?r.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(partyName(e.partyId))+'</td><td>'+esc(e.mode||'Cash')+'</td><td>'+esc(e.reference||'—')+'</td><td class="amount positive">'+money(e.amount)+'</td><td>'+esc(e.note||'')+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">No payments recorded.</td></tr>')+'</tbody></table></div><div class="notice" style="margin-top:14px">UPI payments are recorded manually. This static app cannot verify bank or UPI settlement.</div>'}

function reports(){const d=data(),credit=sum(d.entries.filter(e=>e.type==='credit'),e=>+e.amount),jama=sum(d.entries.filter(e=>e.type==='payment'),e=>+e.amount),sales=sum(d.invoices.filter(i=>i.status!=='cancelled'),i=>+i.total),expense=sum(d.expenses,e=>+e.amount),pay=sum(d.suppliers,s=>Math.max(0,-balance(s.id))),top=d.customers.map(c=>({name:c.name,b:balance(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,8);return'<div class="grid stats">'+stat('Udhaar recorded',money(credit),'Credit entries','↗')+stat('Jama recorded',money(jama),'Payment entries','₹')+stat('Expenses',money(expense),'Recorded expenses','↘')+stat('Estimated net',money(sales-expense),'Sales less expenses','∑')+'</div><div class="grid two-col"><div class="card"><h2 style="font-size:14px">Outstanding by customer</h2>'+(top.length?top.map(x=>'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>'+esc(x.name)+'</span><b>'+money(x.b)+'</b></div>').join(''):'<div class="empty">No customer outstanding.</div>')+'</div><div class="card"><h2 style="font-size:14px">Business totals</h2>'+[['Invoice sales',sales],['Customer Udhaar',credit],['Jama received',jama],['Supplier payable',pay],['Expenses',expense]].map(x=>'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span class="muted">'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'<button class="btn" style="margin-top:14px" data-export="csv">↓ Export transactions CSV</button></div></div>'}

emove records. Export JSON backups regularly. This app does not send UPI payments, verify settlements or automatically send SMS/WhatsApp reminders.</p><p class="hint">Bookkeeping assistance only; verify GST and accounting requirements with a qualified professional.</p></div>'}
function field(label,name,o={}){const t=o.type||'text',v=o.value??'',req=o.required?'required':'';let el=o.options?'<select name="'+name+'" '+req+'>'+o.options.map(x=>'<option value="'+esc(x.value)+'" '+(String(x.value)===String(v)?'selected':'')+'>'+esc(x.label)+'</option>').join('')+'</select>':t==='textarea'?'<textarea name="'+name+'" '+req+'>'+esc(v)+'</textarea>':'<input name="'+name+'" type="'+t+'" '+(o.min!==undefined?'min="'+o.min+'"':'')+' '+(o.step?'step="'+o.step+'"':'')+' '+req+' value="'+esc(v)+'" placeholder="'+esc(o.placeholder||'')+'">';return'<div class="field '+(o.full?'full':'')+'"><label>'+label+'</label>'+el+'</div>'}

function openParty(type,id){const list=data()[type==='supplier'?'suppliers':'customers'],old=list.find(x=>x.id===id)||{};openModal((id?'Edit ':'Add ')+type,'<div class="form-grid">'+field('Name','name',{value:old.name,required:true,full:true})+field('Phone','phone',{value:old.phone})+field('Email','email',{type:'email',value:old.email})+field('Address','address',{value:old.address,full:true})+field('Notes','note',{type:'textarea',value:old.note,full:true})+'</div>',f=>{const x={...old,id:old.id||uid(),name:f.get('name').trim(),phone:f.get('phone'),email:f.get('email'),address:f.get('address'),note:f.get('note')};if(!x.name)return;const i=list.findIndex(p=>p.id===x.id);if(i<0)list.push(x);else list[i]=x;persist();closeModal();render();toast('Account saved')})}
function openEntry(id){const ps=parties();if(!ps.length)return toast('Add a customer or supplier first');openModal('Record khata entry','<div class="form-grid">'+field('Account','partyId',{required:true,value:id||'',options:ps.map(p=>({value:p.id,label:p.name+' ('+p.type+')'})),full:true})+field('Entry type','type',{value:'credit',options:[{value:'credit',label:'Udhaar — credit / amount due'},{value:'payment',label:'Jama — payment received / paid'}]})+field('Amount (₹)','amount',{type:'number',min:'.01',step:'.01',required:true})+field('Date','date',{type:'date',value:today(),required:true})+field('Payment mode','mode',{options:['Cash','UPI','Bank transfer','Cheque','Other'].map(x=>({value:x,label:x}))})+field('Reference / note','note',{full:true})+'</div><p class="hint">For customer accounts, Udhaar increases the due balance and Jama reduces it. For suppliers, record purchases as Udhaar and payments as Jama.</p>',f=>{const a=+f.get('amount');if(a<=0||!f.get('partyId'))return toast('Enter a valid account and amount');data().entries.push({id:uid(),partyId:f.get('partyId'),type:f.get('type'),amount:a,date:f.get('date'),mode:f.get('mode'),note:f.get('note')});persist();closeModal();render();toast('Transaction saved')})}

function adjustStock(id){const p=data().products.find(x=>x.id===id);if(!p)return;openModal('Adjust stock — '+p.name,'<div class="form-grid">'+field('Adjustment','direction',{options:[{value:'add',label:'Add stock'},{value:'remove',label:'Remove stock'}]})+field('Quantity','qty',{type:'number',min:'.01',step:'.01',required:true})+field('Reason','reason',{full:true})+'</div><p class="hint">Current stock: '+p.stock+' '+esc(p.unit)+'</p>',f=>{const q=+f.get('qty');if(q<=0||(f.get('direction')==='remove'&&q>p.stock))return toast('Invalid quantity or insufficient stock');addStockMove(p,f.get('direction')==='add'?q:-q,f.get('reason')||'Manual adjustment','',today());persist();closeModal();render();toast('Stock adjusted')})}
function openInvoice(){const cs=data().customers,ps=data().products;if(!cs.length)return toast('Add a customer first');openModal('Create sales invoice','<div class="form-grid">'+field('Customer','customerId',{required:true,full:true,options:cs.map(c=>({value:c.id,label:c.name}))})+field('Invoice date','date',{type:'date',value:today(),required:true})+field('Invoice type','taxMode',{options:[{value:'gst',label:'GST invoice'},{value:'non-gst',label:'Non-GST invoice'}]})+field('Place of supply / state','place')+field('Product','productId',{options:[{value:'',label:'Custom item / service'},...ps.map(p=>({value:p.id,label:p.name+' — '+money(p.price)}))]})+field('Description','itemName',{placeholder:'Item or service name'})+field('Quantity','qty',{type:'number',min:'.01',step:'.01',value:1})+field('Rate (₹)','rate',{type:'number',min:0,step:'.01',value:0})+field('GST rate (%)','gst',{type:'number',min:0,max:100,step:'.01',value:18})+field('Discount (₹)','discount',{type:'number',min:0,step:'.01',value:0})+'</div><p class="hint">Single line-item invoice. For GST invoices, tax is calculated on the discounted taxable value.</p>',f=>{const c=cs.find(x=>x.id===f.get('customerId')),p=ps.find(x=>x.id===f.get('productId')),qty=+f.get('qty'),rate=+f.get('rate'),base=Math.max(0,qty*rate-(+f.get('discount'))),gst=f.get('taxMode')==='gst'?+f.get('gst'):0,tax=base*gst/100,total=base+tax;if(!c||qty<=0||rate<0)return toast('Check customer, quantity and rate');const num=(data().settings.invoicePrefix||'INV')+'-'+String(data().invoices.length+1).padStart(4,'0'),inv={id:uid(),number:num,date:f.get('date'),customerId:c.id,customerName:c.name,taxMode:f.get('taxMode'),place:f.get('place'),itemName:f.get('itemName')||p?.name||'Item / service',qty,rate,discount:+f.get('discount'),taxRate:gst,tax,total,status:'unpaid'};data().invoices.push(inv);data().entries.push({id:uid(),partyId:c.id,type:'credit',amount:total,date:inv.date,mode:'Invoice',note:'Invoice '+num,invoiceId:inv.id});if(p)p.stock=Math.max(0,p.stock-qty);persist();closeModal();render();printInvoice(inv.id)})}
function printInvoice(id){const i=data().invoices.find(x=>x.id===id);if(!i)return;const s=data().settings,w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print invoice');w.document.write('<!doctype html><html><head><title>'+esc(i.number)+'</title><style>body{font:14px Arial;color:#222;margin:40px}h1{font-size:22px}table{width:100%;border-collapse:collapse;margin-top:30px}td,th{padding:12px;border:1px solid #ddd;text-align:left}.right{text-align:right}.muted{color:#666}</style></head><body><h1>'+esc(s.businessName||current().name)+'</h1><p>'+esc(s.address||'')+'<br>'+esc(s.phone||'')+' · GSTIN: '+esc(s.gstin||'—')+'</p><hr><h2>INVOICE '+esc(i.number)+'</h2><p>Date: '+fmtDate(i.date)+'<br>Bill to: <b>'+esc(i.customerName)+'</b></p><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Tax</th><th>Total</th></tr><tr><td>'+esc(i.itemName)+'</td><td>'+i.qty+'</td><td>'+money(i.rate)+'</td><td>'+money(i.tax)+'</td><td>'+money(i.total)+'</td></tr></table><h2 class="right">Grand total: '+money(i.total)+'</h2><p class="muted">Computer-generated invoice. Verify applicable tax details before issuing.</p><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()}
function openExpense(){openModal('Add expense','<div class="form-grid">'+field('Date','date',{type:'date',value:today(),required:true})+field('Category','category',{options:['Rent','Salary','Utilities','Travel','Purchase','Maintenance','Other'].map(x=>({value:x,label:x}))})+field('Amount (₹)','amount',{type:'number',min:'.01',step:'.01',required:true})+field('Payment mode','mode',{options:['Cash','UPI','Bank transfer','Card','Other'].map(x=>({value:x,label:x}))})+field('Description','note',{full:true})+'</div>',f=>{if(+f.get('amount')<=0)return;data().expenses.push({id:uid(),date:f.get('date'),category:f.get('category'),amount:+f.get('amount'),mode:f.get('mode'),note:f.get('note')});persist();closeModal();render();toast('Expense saved')})}

function stockHistory(){const r=[...data().stockMoves].sort((a,b)=>b.date.localeCompare(a.date));return '<div class="toolbar"><div><b>Stock movement history</b><div class="hint">Purchases, sales, returns and manual adjustments</div></div><button class="btn" data-go="inventory">← Inventory</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Reason</th><th>Change</th><th>Before</th><th>After</th><th>Reference</th></tr></thead><tbody>'+(r.length?r.map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+esc(x.productName)+'</td><td>'+esc(x.reason)+'</td><td class="'+(x.delta>=0?'positive':'negative')+'">'+(x.delta>0?'+':'')+x.delta+'</td><td>'+x.before+'</td><td>'+x.after+'</td><td>'+esc(x.reference)+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">No stock movements recorded.</td></tr>')+'</tbody></table></div>'}
function cashbook(){const d=data(),rows=[...d.entries.filter(e=>e.type==='payment').map(e=>({date:e.date,party:partyName(e.partyId),mode:e.mode||'Cash',ref:e.reference||e.note||'',amount:parties().find(p=>p.id===e.partyId)?.type==='supplier'?-e.amount:+e.amount,reconciled:e.reconciled,id:e.id,kind:'Payment'})),...d.expenses.map(e=>({date:e.date,party:e.category,mode:e.mode||'Cash',ref:e.note||'',amount:-e.amount,kind:'Expense'}))].sort((a,b)=>b.date.localeCompare(a.date));let bal=0;const sorted=[...rows].reverse().map(x=>(bal+=x.amount,{...x,balance:bal})).reverse();return '<div class="toolbar"><div><b>Cashbook</b><div class="hint">Cash inflows, outflows and running balance</div></div><button class="btn" data-export="csv">↓ Export CSV</button></div><div class="grid stats">'+stat('Cash received',money(sum(rows.filter(x=>x.amount>0),x=>x.amount)),'Customer payments','↗')+stat('Cash paid',money(-sum(rows.filter(x=>x.amount<0),x=>x.amount)),'Supplier payments and expenses','↘')+stat('Net movement',money(sum(rows,x=>x.amount)),'Selected business history','₹')+stat('Entries',rows.length,'Cashbook records','▤')+'</div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Account / category</th><th>Mode</th><th>Details</th><th>In / Out</th><th>Running</th><th>Reconcile</th></tr></thead><tbody>'+(sorted.length?sorted.map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+esc(x.party)+'</td><td>'+esc(x.mode)+'</td><td>'+esc(x.ref)+'</td><td class="amount '+(x.amount>=0?'positive':'negative')+'">'+money(x.amount)+'</td><td>'+money(x.balance)+'</td><td>'+(x.kind==='Payment'?'<button class="btn small" data-reconcile="'+x.id+'">'+(x.reconciled?'✓ Matched':'Mark matched')+'</button>':'—')+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">No cashbook entries yet.</td></tr>')+'</tbody></table></div>'}
function reports(){const d=data(),sales=sum(d.invoices.filter(i=>i.status!=='cancelled'),i=>+i.total),cogs=sum(d.invoices.filter(i=>i.status!=='cancelled'),i=>sum(invoiceItems(i),x=>x.qty*(+x.cost||0))),purchase=sum(d.purchases,p=>+p.total),expense=sum(d.expenses,e=>+e.amount),salesReturn=sum(d.returns.filter(x=>x.type==='sales'),x=>+x.amount),purchaseReturn=sum(d.returns.filter(x=>x.type==='purchase'),x=>+x.amount),taxOut=sum(d.invoices,i=>+i.tax||0),taxIn=sum(d.purchases,p=>sum(p.items||[],x=>+x.tax||0)),netSales=sales-salesReturn,netCost=cogs,profit=netSales-netCost-expense,unpaid=d.invoices.filter(i=>dueAmount(i)>0),age={current:0,d30:0,d60:0,d90:0};unpaid.forEach(i=>{const days=Math.max(0,Math.floor((Date.now()-new Date((i.dueDate||i.date)+'T00:00:00').getTime())/86400000));age[days<=30?'current':days<=60?'d30':days<=90?'d60':'d90']+=dueAmount(i)});const outstanding=sum(unpaid,dueAmount);return '<div class="grid stats">'+stat('Net sales',money(netSales),'Sales less returns','↗')+stat('Cost of goods sold',money(netCost),'Recorded invoice item costs','▧')+stat('Operating expenses',money(expense),'Recorded expenses','↘')+stat('Estimated net profit',money(profit),'Before other adjustments','∑')+'</div><div class="grid two-col"><section class="card"><h2>Profit & loss</h2>'+[['Gross sales',sales],['Sales returns',-salesReturn],['Cost of goods sold',-netCost],['Purchase value (reference)',purchase-purchaseReturn],['Operating expenses',-expense],['Estimated net profit',profit]].map(x=>'<div class="report-row"><span>'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'</section><section class="card"><h2>Cash flow summary</h2>'+[['Customer payments',sum(d.entries.filter(e=>e.type==='payment'&&parties().find(p=>p.id===e.partyId)?.type==='customer'),e=>+e.amount)],['Supplier payments',sum(d.entries.filter(e=>e.type==='payment'&&parties().find(p=>p.id===e.partyId)?.type==='supplier'),e=>+e.amount)],['Expenses',expense],['Net cashbook movement',sum(d.entries.filter(e=>e.type==='payment'),e=>parties().find(p=>p.id===e.partyId)?.type==='supplier'?-e.amount:+e.amount)-expense]].map(x=>'<div class="report-row"><span>'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'</section><section class="card"><h2>GST summary</h2>'+[['Output tax on sales',taxOut],['Input tax on purchases',taxIn],['Sales return tax (estimated)',sum(d.returns.filter(x=>x.type==='sales'),x=>x.amount)-salesReturn],['Net tax position (indicative)',taxOut-taxIn]].map(x=>'<div class="report-row"><span>'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'<p class="hint">Indicative bookkeeping summary only; verify GST treatment with your tax professional.</p></section><section class="card"><h2>Receivables ageing</h2>'+[['0–30 days',age.current],['31–60 days',age.d30],['61–90 days',age.d60],['Over 90 days',age.d90],['Total outstanding',outstanding]].map(x=>'<div class="report-row"><span>'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'</section></div><div class="actions" style="margin-top:16px"><button class="btn" data-print-report>Print / Save reports as PDF</button><button class="btn" data-export="csv">Export transaction CSV</button></div>'}
function settings(){const s=data().settings,st=storageInfo();return '<div class="grid two-col"><section class="card"><h2>Business profile</h2><form id="profileForm" class="form-grid">'+field('Business name','businessName',{value:s.businessName||current().name,required:true,full:true})+field('Phone','phone',{value:s.phone})+field('GSTIN','gstin',{value:s.gstin})+field('Business address','address',{type:'textarea',value:s.address,full:true})+field('UPI ID','upi',{value:s.upi,placeholder:'name@bank'})+field('Low-stock threshold','lowStock',{type:'number',min:0,value:s.lowStock||5})+field('Invoice prefix','invoicePrefix',{value:s.invoicePrefix||'INV'})+field('Invoice print template','invoiceTemplate',{value:s.invoiceTemplate||'standard',options:[{value:'standard',label:'Standard'},{value:'compact',label:'Compact'}]})+field('Appearance','theme',{value:s.theme||'light',options:[{value:'light',label:'Light'},{value:'dark',label:'Dark'}]})+field('Language','language',{value:s.language||'en',options:[{value:'en',label:'English'},{value:'hi',label:'हिन्दी'}]})+'<div class="field" style="align-content:end"><button class="btn primary">Save profile & preferences</button></div></form></section><section class="card"><h2>Business management</h2><p class="hint">Each business has independent accounts, ledgers, invoices, stock and purchases.</p><div class="actions" style="margin:15px 0"><button class="btn primary" data-action="business">＋ Add business</button><button class="btn" data-action="rename-business">Rename current</button></div><h2>Backup & recovery</h2><div class="actions"><button class="btn primary" data-export="all">↓ Backup all</button><button class="btn" data-export="current">↓ Current business</button><button class="btn" data-action="import">↑ Restore backup</button><button class="btn" data-action="undo">↶ Undo last save</button></div><p class="hint">Last-known-good recovery snapshot is kept locally when a save succeeds. Export backups regularly.</p><div class="notice">Storage used by this app: '+st.kb+' KB · '+st.keys+' local storage keys</div><button class="btn danger" style="margin-top:12px" data-action="clear">Clear current business data</button></section></div><div class="card" style="margin-top:16px"><h2>Privacy and limitations</h2><p class="hint">Records stay in this browser and are not encrypted or synced. UPI opens a payment intent; settlement verification is not available. WhatsApp sharing requires the user to send the prepared message. GST and financial reports are estimates and should be reviewed by an accountant.</p></div>'}
function undoLastSave(){const raw=localStorage.getItem('digitalKhata.recovery.v1');if(!raw)return toast('No recovery snapshot is available');try{const old=normalizeState(JSON.parse(raw)),now=JSON.stringify(state);localStorage.setItem('digitalKhata.recovery.v1',now);state=old;localStorage.setItem(KEY,JSON.stringify(state));updateSelect();render();toast('Restored previous saved state')}catch(e){toast('Recovery snapshot could not be restored')}}
function importBackup(){openModal('Restore backup','<div class="field full"><label>Choose a Digital Khata JSON backup</label><input type="file" name="backup" accept=".json,application/json" required></div><div class="notice warn" style="margin-top:12px">The file is validated before replacing current data. Export a backup first.</div>',async f=>{try{const obj=normalizeState(JSON.parse(await f.get('backup').text()));for(const b of obj.businesses){for(const key of ['customers','suppliers','entries','products','invoices','expenses','reminders','purchases','returns','stockMoves'])if(!Array.isArray(b.data[key]))throw Error('Invalid '+key);if(b.data.products.some(p=>!p.id||!p.name||!Number.isFinite(+p.stock)||+p.stock<0))throw Error('Invalid product')}if(!confirm('Replace all current business data with this backup?'))return;const old=JSON.stringify(state);localStorage.setItem('digitalKhata.recovery.v1',old);state=obj;if(!persist())throw Error('Storage full');closeModal();updateSelect();render();toast('Backup validated and restored')}catch(e){toast('Backup rejected: '+e.message)}})}
function action(a){({party:()=>openParty('customer'),customer:()=>openParty('customer'),supplier:()=>openParty('supplier'),entry:()=>openEntry(),payment:()=>openEntry(),product:()=>openProduct(),invoice:openInvoice,purchase:openPurchase,return:openReturn,expense:openExpense,reminder:openReminder,business:addBusiness,'rename-business':renameBusiness,import:importBackup,clear:clearBusiness,undo:undoLastSave})[a]?.()}

rget.closest('[data-print-report]');if(prt)window.print()});$('#modalBody').addEventListener('change',e=>{if(e.target.name==='itemProduct'){const p=data().products.find(x=>x.id===e.target.value),row=e.target.closest('.invoice-row');if(p&&row){row.querySelector('[name=itemName]').value=p.name;row.querySelector('[name=itemRate]').value=p.cost&&page==='purchases'?p.cost:p.price;row.querySelector('[name=itemGst]').value=18}}});
