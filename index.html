tems:center;gap:9px}.content{padding:26px 30px 44px;max-width:1500px;margin:auto}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}.stat{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.stat-label{font-size:12px;color:var(--muted);font-weight:600}.stat-value{font-size:25px;font-weight:800;letter-spacing:-.8px;margin-top:10px}.stat-note{font-size:11px;color:var(--muted);margin-top:5px}.stat-icon{width:36px;height:36px;border-radius:11px;background:#edf2ff;display:grid;place-items:center;font-size:17px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.section-head h2{font-size:15px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:4px 0 0}.two-col{grid-template-columns:1.35fr 1fr}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px}.btn:hover{background:#f7f9fc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1948bf}.btn.soft{background:var(--blue2);border-color:transparent;color:var(--blue)}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;min-height:30px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}.search{position:relative;min-width:210px;max-width:340px;flex:1}.search input{width:100%;padding:10px 12px 10px 35px;border:1px solid var(--line);border-radius:10px;background:#fff}.search span{position:absolute;left:12px;top:10px;color:#929baa}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-c ize:12px;line-height:1.5}.notice.warn{background:#fff6e6;color:#88580d}.quick-grid{grid-template-columns:repeat(4,1fr)}.quick{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;text-align:left;display:grid;gap:9px;color:var(--ink)}.quick:hover{border-color:#b7c8fa;background:#fbfcff}.quick span:first-child{font-size:19px}.quick strong{font-size:12px}.quick small{font-size:10px;color:var(--muted)}.mobile-menu{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172333;color:white;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:30;font-size:12px}.hidden{display:none!important}.business-card{display:flex;align-items:center;gap:12px}.business-avatar{width:42px;height:42px;border-radius:13px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.progress{height:7px;border-radius:9px;background:#edf0f5;overflow:hidden}.progress i{display:block;height:100%;background:#6f91e8;border-radius:9px}.footer-note{text-align:center;color:#9aa3b0;font-size:10px;padding:25px 0 0}

.invoice-rows{display:grid;gap:8px}.invoice-row{display:grid;grid-template-columns:1.25fr 1.2fr .65fr .8fr .65fr 36px;gap:6px;align-items:center;margin-bottom:7px}.invoice-row input,.invoice-row select{min-width:0;width:100%;padding:9px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:12px}.report-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.report-row:last-child{border-bottom:0}.actions{display:flex;flex-wrap:wrap;gap:7px}[data-theme=dark]{--bg:#111827;--panel:#1c2736;--ink:#edf2f8;--muted:#a6b2c2;--line:#344254;--blue:#7ea5ff;--blue2:#263b60;--shadow:0 8px 28px #0003}[data-theme=dark] .sidebar,[data-theme=dark] .topbar,[data-theme=dark] .table-wrap,[data-theme=dark] .btn,[data-theme=dark] .quick{background:var(--panel);color:var(--ink)}[data-theme=dark] .business-select,[data-theme=dark] .field input,[data-theme=dark] .field select,[data-theme=dark] .field textarea,[data-theme=dark] .search input{background:#111b29;color:var(--ink);border-color:var(--line)}[data-theme=dark] th{background:#202d3e;color:#bac6d6}[data-theme=dark] tbody tr:hover{background:#253348}.btn:focus-visible,.nav button:focus-visible{outline:3px solid #8eafff;outline-offset:2px}@media print{.sidebar,.topbar,.toolbar button,.actions,.btn{display:none!important}.app{display:block}.content{padding:0;max-width:none}.table-wrap{overflow:visible}table{white-space:normal}.card{box-shadow:none;break-inside:avoid}}@media(max-width:760px){.invoice-row{grid-template-columns:1fr 1fr 1fr}.invoice-row [name=itemName]{grid-column:span 2}.invoice-row [name=itemProduct]{grid-column:span 3}.invoice-row button{grid-column:3}.invoice-row input,.invoice-row select{min-height:42px}}.personal-tabs{flex-wrap:wrap;margin-bottom:16px}.personal-tabs .btn{min-height:40px}.personal-content{display:grid;gap:16px}.budget-row{padding:12px 0;border-bottom:1px solid var(--line)}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--green);border-radius:99px}.personal-content .toolbar{margin-bottom:12px}@media(max-width:480px){.personal-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.personal-tabs .btn{padding:9px 6px;font-size:12px}}</style></head><body>

<button data-page="personal"><span class="ico">⌂</span>Personal & Family</button><div class="nav-label">PREFERENCES</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings & Backup</button></nav>
<div class="side-bottom">Your records stay in this browser.<br><b id="storageLabel">Local storage active</b><br>Export backups regularly.</div></aside>
<main class="main"><header class="topbar"><div class="top-left"><button class="btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div><h1 id="pageTitle">Dashboard</h1><div class="eyebrow" id="todayLabel"></div></div></div><div class="top-actions"><span class="pill green">● Local mode</span><button class="btn" id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">◐</button><button class="btn desktop-only" id="installBtn" hidden>＋ Install app</button><button class="btn primary" id="quickAddBtn">＋ Add entry</button></div></header><div class="content" id="view"></div></main></div>

<script src="./qrcode.js"></script>
<script>
(()=>{'use strict';
const KEY='digitalKhata.v1',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankPersonal=()=>({transactions:[],budgets:[],goals:[],bills:[],tasks:[],documents:[],assets:[],subscriptions:[],appointments:[],contacts:[],accounts:[{id:'cash',name:'Cash',opening:0},{id:'bank',name:'Bank',opening:0},{id:'upi',name:'UPI',opening:0}],members:[],sharedExpenses:[],settlements:[],shoppingItems:[],loans:[],vehicles:[],trash:[]});
const blank=()=>({customers:[],suppliers:[],entries:[],products:[],invoices:[],expenses:[],reminders:[],purchases:[],returns:[],stockMoves:[],settings:{businessName:'',phone:'',address:'',gstin:'',upi:'',lowStock:5,invoicePrefix:'INV',theme:'light',language:'en',invoiceTemplate:'standard'}});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.businesses)&&v.businesses.length)return normalizeState(v)}catch(e){try{const b=JSON.parse(localStorage.getItem('digitalKhata.recovery.v1'));if(b)return normalizeState(b)}catch(_){}}const b={id:uid(),name:'My Business',data:blank()};return normalizeState({version:2,active:b.id,businesses:[b]})}
let state=load(),page='dashboard',searchText='',modalAction=null,installPrompt=null,personalTab='overview';const current=()=>state.businesses.find(b=>b.id===state.active)||state.businesses[0],data=()=>current().data;
function persist(){try{const next=JSON.stringify(state),previous=localStorage.getItem(KEY);if(previous&&previous!==next)localStorage.setItem('digitalKhata.recovery.v1',previous);localStorage.setItem(KEY,next);$('#storageLabel').textContent='Saved · '+storageInfo().kb+' KB';return true}catch(e){toast('Could not save: storage is full. Export a backup and clear unused browser data.');return false}}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2800)}
function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}
function parties(){return[...data().customers.map(x=>({...x,type:'customer'})),...data().suppliers.map(x=>({...x,type:'supplier'}))]}
function partyName(id){return parties().find(x=>x.id===id)?.name||'Unknown account'}
function balance(id){const supplier=data().suppliers.some(x=>x.id===id);return data().entries.filter(e=>e.partyId===id).reduce((s,e)=>s+(e.type==='credit'?(supplier?-e.amount:+e.amount):(supplier?+e.amount:-e.amount)),0)}
function sum(a,f){return a.reduce((s,x)=>s+f(x),0)}
function updateSelect(){$('#businessSelect').innerHTML=state.businesses.map(b=>'<option value="'+esc(b.id)+'" '+(b.id===state.active?'selected':'')+'>'+esc(b.name)+'</option>').join('')}
const titles={dashboard:'Dashboard',ledger:'Khata Ledger',customers:'Customers',suppliers:'Suppliers',payments:'Payments',invoices:'Invoices & Sales',inventory:'Inventory',purchases:'Purchases',cashbook:'Cashbook',returns:'Returns',stockHistory:'Stock History',expenses:'Expenses',reminders:'Payment Reminders',reports:'Reports & Analytics',settings:'Settings & Backup',personal:'Personal & Family'};
function go(p){page=p;searchText='';$('#pageTitle').textContent=titles[p]||'Dashboard';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
function render(){applyTheme();const themeButton=$('#themeToggle');if(themeButton)themeButton.setAttribute('aria-pressed',data().settings.theme==='dark'?'true':'false');updateSelect();$('#todayLabel').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+current().name;const map={personal:personalPage,dashboard,ledger:()=>partyTable('all'),customers:()=>partyTable('customer'),suppliers:()=>partyTable('supplier'),payments,invoices,inventory,purchases,cashbook,returns,stockHistory,expenses,reminders,reports,settings};$('#view').innerHTML=(map[page]||dashboard)();bindView();applyLanguage()}
function stat(l,v,n,i){return'<div class="card"><div class="stat"><div><div class="stat-label">'+l+'</div><div class="stat-value">'+v+'</div><div class="stat-note">'+n+'</div></div><div class="stat-icon">'+i+'</div></div></div>'}
function quick(i,t,s,a){return'<button class="quick" data-action="'+a+'"><span>'+i+'</span><strong>'+t+'</strong><small>'+s+'</small></button>'}
function dashboard(){const d=data(),recv=sum(d.customers,c=>Math.max(0,balance(c.id))),pay=sum(d.suppliers,c=>Math.max(0,-balance(c.id))),sales=sum(d.invoices.filter(i=>i.status!=='cancelled'),i=>+i.total),paid=sum(d.entries.filter(e=>e.type==='payment'),e=>+e.amount),low=d.products.filter(p=>+p.stock<=+(d.settings.lowStock||5)),recent=[...d.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
return'<div class="grid stats">'+stat('Receivables',money(recv),'Customer outstanding','↗')+stat('Payables',money(pay),'Supplier balances','↘')+stat('Total sales',money(sales),'Recorded invoices','▧')+stat('Payments received',money(paid),'Recorded Jama entries','₹')+'</div><div class="section-head"><div><h2>Quick actions</h2><p>Common tasks for your business</p></div></div><div class="grid quick-grid">'+quick('＋','New khata entry','Record Udhaar or Jama','entry')+quick('♙','Add customer','Create a customer account','customer')+quick('▧','Create invoice','Prepare a customer bill','invoice')+quick('▣','Add product','Update inventory','product')+'</div><div class="grid two-col"><section><div class="section-head"><div><h2>Recent transactions</h2><p>Your latest ledger activity</p></div><button class="btn small" data-go="ledger">View ledger →</button></div><div class="card" style="padding:0"><div class="table-wrap" style="border:0"><table><thead><tr><th>Date</th><th>Account</th><th>Type</th><th>Amount</th></tr></thead><tbody>'+(recent.length?recent.map(e=>'<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(partyName(e.partyId))+'</td><td><span class="pill '+(e.type==='credit'?'amber':'green')+'">'+(e.type==='credit'?'Udhaar':'Jama')+'</span></td><td class="amount">'+money(e.amount)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">No transactions yet. Add your first entry.</td></tr>')+'</tbody></table></div></div></section><section><div class="section-head"><div><h2>Stock alerts</h2><p>Items at or below minimum stock</p></div><button class="btn small" data-go="inventory">Inventory →</button></div><div class="card">'+(low.length?low.slice(0,5).map(p=>'<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><b>'+esc(p.name)+'</b><span class="pill red">'+p.stock+' '+esc(p.unit||'pcs')+'</span></div>').join(''):'<div class="empty"><strong>Stock looks good</strong>No low-stock items right now.</div>')+'</div><div class="section-head"><h2>Business snapshot</h2></div><div class="card"><div class="business-card"><div class="business-avatar">₹</div><div><b>'+esc(current().name)+'</b><div class="muted">'+d.customers.length+' customers · '+d.suppliers.length+' suppliers</div></div></div></div></section></div>'}
function toolbar(ph,btn,a){return'<div class="toolbar"><div class="search"><span>⌕</span><input id="tableSearch" placeholder="'+ph+'" value="'+esc(searchText)+'"></div><button class="btn primary" data-action="'+a+'">＋ '+btn+'</button></div>'}

function reports(){const d=data(),credit=sum(d.entries.filter(e=>e.type==='credit'),e=>+e.amount),jama=sum(d.entries.filter(e=>e.type==='payment'),e=>+e.amount),sales=sum(d.invoices.filter(i=>i.status!=='cancelled'),i=>+i.total),expense=sum(d.expenses,e=>+e.amount),pay=sum(d.suppliers,s=>Math.max(0,-balance(s.id))),top=d.customers.map(c=>({name:c.name,b:balance(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b).slice(0,8);return'<div class="grid stats">'+stat('Udhaar recorded',money(credit),'Credit entries','↗')+stat('Jama recorded',money(jama),'Payment entries','₹')+stat('Expenses',money(expense),'Recorded expenses','↘')+stat('Estimated net',money(sales-expense),'Sales less expenses','∑')+'</div><div class="grid two-col"><div class="card"><h2 style="font-size:14px">Outstanding by customer</h2>'+(top.length?top.map(x=>'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>'+esc(x.name)+'</span><b>'+money(x.b)+'</b></div>').join(''):'<div class="empty">No customer outstanding.</div>')+'</div><div class="card"><h2 style="font-size:14px">Business totals</h2>'+[['Invoice sales',sales],['Customer Udhaar',credit],['Jama received',jama],['Supplier payable',pay],['Expenses',expense]].map(x=>'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span class="muted">'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'<button class="btn" style="margin-top:14px" data-export="csv">↓ Export transactions CSV</button></div></div>'}

.category&&t.accountId===x.accountId&&String(t.person||'')===String(x.person||''));if(duplicate&&!confirm('A similar transaction already exists on this date. Save another one anyway?'))return false;const i=personal().transactions.findIndex(t=>t.id===x.id);if(i<0)personal().transactions.push(x);else personal().transactions[i]=x})}

function openSharedExpense(id){const old=personal().sharedExpenses.find(x=>x.id===id)||{},members=personal().members;if(members.length<2)return toast('Add at least two household members first');const selected=old.participantIds||members.map(m=>m.id);const checks=members.map(m=>'<label style="display:flex;gap:8px;align-items:center;font-size:12px;padding:5px 0"><input type="checkbox" name="participants" value="'+esc(m.id)+'" '+(selected.includes(m.id)?'checked':'')+'> '+esc(m.name)+'</label>').join('');pAdd('shared-expense','Shared household expense','<div class="form-grid">'+field('Description','description',{required:true,value:old.description,full:true})+field('Total amount (₹)','amount',{type:'number',min:'.01',step:'.01',required:true,value:old.amount})+field('Date','date',{type:'date',required:true,value:old.date||today()})+field('Paid by','paidBy',{required:true,value:old.paidBy||members[0].id,options:members.map(m=>({value:m.id,label:m.name}))})+'<div class="field full"><label>Split equally between</label>'+checks+'</div></div><p class="hint">The payer can be included in the split. This is a family settlement record only: it does not create a second cashbook expense.</p>',f=>{const amount=+f.get('amount'),participantIds=f.getAll('participants');if(!(amount>0)||!participantIds.length)return toast('Enter an amount and select at least one participant');if(!members.some(m=>m.id===f.get('paidBy')))return toast('Select a valid payer');const x={id:old.id||uid(),description:f.get('description').trim(),amount,date:f.get('date'),paidBy:f.get('paidBy'),participantIds};if(!x.description)return false;const i=personal().sharedExpenses.findIndex(y=>y.id===x.id);if(i<0)personal().sharedExpenses.push(x);else personal().sharedExpenses[i]=x})}
function openFamilySettlement(){const members=personal().members;if(members.length<2)return toast('Add at least two household members first');pAdd('family-settlement','Record family settlement','<div class="form-grid">'+field('Paid by','fromId',{required:true,options:members.map(m=>({value:m.id,label:m.name}))})+field('Paid to','toId',{required:true,value:members[1].id,options:members.map(m=>({value:m.id,label:m.name}))})+field('Amount (₹)','amount',{type:'number',min:'.01',step:'.01',required:true})+field('Date','date',{type:'date',required:true,value:today()})+field('Note','note',{value:'Shared expense settlement',full:true})+'</div><p class="hint">Record only a settlement that has actually happened. It adjusts family balances but does not alter personal cashbook transactions.</p>',f=>{const amount=+f.get('amount'),fromId=f.get('fromId'),toId=f.get('toId');if(!(amount>0)||fromId===toId)return toast('Choose two different members and a valid amount');personal().settlements.push({id:uid(),fromId,toId,amount,date:f.get('date'),note:f.get('note')})})}

function openPersonalTask(id){const old=personal().tasks.find(x=>x.id===id)||{};pAdd('personal-task','Personal task / family chore','<div class="form-grid">'+field('Task','name',{required:true,value:old.name,full:true})+field('Due date','date',{type:'date',value:old.date||today()})+field('Assigned family member','memberId',{value:old.memberId||'',options:[{value:'',label:'Unassigned'},...personal().members.map(m=>({value:m.id,label:m.name}))]})+field('Priority','priority',{value:old.priority||'Normal',options:['Low','Normal','High'].map(x=>({value:x,label:x}))})+field('Status','status',{value:old.status||'Open',options:['Open','Done'].map(x=>({value:x,label:x}))})+'</div>',f=>{const x={id:old.id||uid(),name:f.get('name').trim(),date:f.get('date'),memberId:f.get('memberId')||'',priority:f.get('priority'),status:f.get('status')};if(!x.name)return false;const i=personal().tasks.findIndex(t=>t.id===x.id);if(i<0)personal().tasks.push(x);else personal().tasks[i]=x})}
function addMonthsToDate(value,months){const d=new Date((value||today())+'T00:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return dateKey(d)}

function deletePersonalRecord(type,id){const list=personal()[type];if(!Array.isArray(list))return;if(type==='members'&&((personal().sharedExpenses||[]).some(x=>x.paidBy===id||(x.participantIds||[]).includes(id))||(personal().settlements||[]).some(x=>x.fromId===id||x.toId===id)||(personal().shoppingItems||[]).some(x=>x.assigneeId===id)||(personal().tasks||[]).some(x=>x.memberId===id)||(personal().budgets||[]).some(x=>x.memberId===id)||(personal().goals||[]).some(x=>x.memberId===id)))return toast('This member is linked to family records. Reassign or remove those records first.');if(!confirm('Move this record to Recently deleted?'))return;const record=list.find(x=>x.id===id);if(record)personal().trash.push({id:uid(),recordType:type,record:JSON.parse(JSON.stringify(record)),deletedAt:today()});personal()[type]=list.filter(x=>x.id!==id);persist();render();toast('Moved to Recently deleted')}

function field(label,name,o={}){const t=o.type||'text',v=o.value??'',req=o.required?'required':'',id='field-'+name;let el=o.options?'<select id="'+id+'" name="'+name+'" '+req+'>'+o.options.map(x=>'<option value="'+esc(x.value)+'" '+(String(x.value)===String(v)?'selected':'')+'>'+esc(x.label)+'</option>').join('')+'</select>':t==='textarea'?'<textarea id="'+id+'" name="'+name+'" '+req+'>'+esc(v)+'</textarea>':'<input id="'+id+'" name="'+name+'" type="'+t+'" '+(o.min!==undefined?'min="'+o.min+'"':'')+' '+(o.max!==undefined?'max="'+o.max+'"':'')+' '+(o.step?'step="'+o.step+'"':'')+' '+req+' value="'+esc(v)+'" placeholder="'+esc(o.placeholder||'')+'">';return'<div class="field '+(o.full?'full':'')+'"><label for="'+id+'">'+label+'</label>'+el+'</div>'}

th.max(0,p.stock-qty);persist();closeModal();render();printInvoice(inv.id)})}

function printInvoice(id){const i=data().invoices.find(x=>x.id===id);if(!i)return;const s=data().settings,w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print invoice');const compact=s.invoiceTemplate==='compact';const rows=invoiceItems(i).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.rate)+'</td><td>'+x.gst+'%</td><td>'+money(x.tax)+'</td><td>'+money(x.qty*x.rate+x.tax)+'</td></tr>').join(''),upi=upiLink(dueAmount(i),i.number);w.document.write('<!doctype html><html><head><title>'+esc(i.number)+'</title><style>body{font:14px Arial;color:#222;margin:'+ (compact?'18px':'36px') + '}h1{font-size:'+ (compact?'18px':'22px') + '}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{padding:10px;border:1px solid #ddd;text-align:left}.right{text-align:right}.muted{color:#666}.head{display:flex;justify-content:space-between;gap:20px}.paid{color:#16845b;font-weight:bold}@media print{button{display:none}}</style></head><body><div class="head"><div><h1>'+esc(s.businessName||current().name)+'</h1><p>'+esc(s.address||'')+'<br>'+esc(s.phone||'')+' · GSTIN: '+esc(s.gstin||'—')+'</p></div><div><h2>INVOICE '+esc(i.number)+'</h2><p>Date: '+fmtDate(i.date)+'<br>Due: '+fmtDate(i.dueDate)+'</p></div></div><hr><p>Bill to: <b>'+esc(i.customerName)+'</b></p><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>GST</th><th>Tax</th><th>Total</th></tr>'+rows+'</table><h3 class="right">Subtotal: '+money(i.subTotal??i.total-i.tax)+'</h3><h3 class="right">Tax: '+money(i.tax)+'</h3><h2 class="right">Grand total: '+money(i.total)+'</h2><p>Paid: '+money(i.paidAmount||0)+' · Balance: '+money(dueAmount(i))+'</p><p class="paid">Status: '+invoiceStatus(i).toUpperCase()+'</p>'+(s.upi?'<p>UPI ID: '+esc(s.upi)+' · <a href="'+esc(upi)+'">Pay via UPI</a></p>':'')+'<p class="muted">Thank you for your business.</p><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()}

function editEntry(id){const e=data().entries.find(x=>x.id===id);if(!e)return;if((e.invoiceId||e.purchaseId)&&e.type==='credit'||e.returnId)return toast('This transaction is generated from a document and cannot be edited here');const ps=parties();openModal('Edit transaction','<div class="form-grid">'+field('Account','partyId',{required:true,value:e.partyId,options:ps.map(p=>({value:p.id,label:p.name+' ('+p.type+')'})),full:true})+field('Entry type','type',{value:e.type,options:[{value:'credit',label:'Udhaar / credit'},{value:'payment',label:'Jama / payment'}]})+field('Amount (₹)','amount',{type:'number',min:'.01',step:'.01',required:true,value:e.amount})+field('Date','date',{type:'date',value:e.date,required:true})+field('Payment mode','mode',{value:e.mode||'Cash',options:['Cash','UPI','Bank transfer','Cheque','Other'].map(x=>({value:x,label:x}))})+field('Reference / note','note',{value:e.note||'',full:true})+'</div>',f=>{const amount=+f.get('amount'),partyId=f.get('partyId'),type=f.get('type');if(amount<=0)return toast('Enter a valid amount');if((e.invoiceId||e.purchaseId)&&(partyId!==e.partyId||type!=='payment'))return toast('Linked document payments must remain attached to their original account');if(e.invoiceId){const inv=data().invoices.find(x=>x.id===e.invoiceId),next=(+inv?.paidAmount||0)-(+e.amount||0)+amount;if(!inv||next>inv.total+.005)return toast('Payment exceeds the invoice total');inv.paidAmount=Math.max(0,next);inv.status=invoiceStatus(inv)}if(e.purchaseId){const pur=data().purchases.find(x=>x.id===e.purchaseId),next=(+pur?.paidAmount||0)-(+e.amount||0)+amount;if(!pur||next>pur.total+.005)return toast('Payment exceeds the purchase total');pur.paidAmount=Math.max(0,next);pur.status=pur.paidAmount>=pur.total?'paid':pur.paidAmount>0?'partial':'unpaid'}Object.assign(e,{partyId,type,amount,date:f.get('date'),mode:f.get('mode'),note:f.get('note')});persist();closeModal();renderLedgerParty(e.partyId);toast('Transaction updated')})}

function action(a){({party:()=>openParty('customer'),customer:()=>openParty('customer'),supplier:()=>openParty('supplier'),entry:()=>openEntry(),payment:()=>openEntry(),product:()=>openProduct(),invoice:openInvoice,purchase:openPurchase,return:openReturn,expense:openExpense,reminder:openReminder,business:addBusiness,'rename-business':renameBusiness,import:importBackup,clear:clearBusiness,undo:undoLastSave,'personal-transaction':openPersonalTransaction,'personal-budget':openPersonalBudget,'personal-goal':openPersonalGoal,'personal-bill':openPersonalBill,'personal-task':openPersonalTask,'personal-document':openPersonalDocument,'personal-account':openPersonalAccount,'personal-member':openPersonalMember,'personal-asset':openPersonalAsset,'personal-subscription':openPersonalSubscription,'personal-appointment':openPersonalAppointment,'shared-expense':openSharedExpense,'family-settlement':openFamilySettlement,'shopping-item':openShoppingItem,'personal-loan':openPersonalLoan,'personal-vehicle':openPersonalVehicle})[a]?.()}

function bindEvents(){document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){go(n.dataset.page);return}const pt=e.target.closest('[data-personal-tab]');if(pt){personalTab=pt.dataset.personalTab;render();return}const pd=e.target.closest('[data-pdelete]');if(pd){deletePersonalRecord(pd.dataset.pdelete,pd.dataset.id);return}const pe=e.target.closest('[data-pedit]');if(pe){({transactions:openPersonalTransaction,budgets:openPersonalBudget,goals:openPersonalGoal,bills:openPersonalBill,tasks:openPersonalTask,documents:openPersonalDocument,members:openPersonalMember,assets:openPersonalAsset,subscriptions:openPersonalSubscription,appointments:openPersonalAppointment,shoppingItems:openShoppingItem,sharedExpenses:openSharedExpense,loans:openPersonalLoan,vehicles:openPersonalVehicle})[pe.dataset.pedit]?.(pe.dataset.id);return}const px=e.target.closest('[data-personal-export]');if(px){download('digital-khata-personal-'+today()+'.json',JSON.stringify(personal(),null,2),'application/json');toast('Personal backup downloaded');return}const pcsv=e.target.closest('[data-personal-csv]');if(pcsv){exportPersonalCsv();return}const emi=e.target.closest('[data-loan-emi]');if(emi){recordLoanEmi(emi.dataset.loanEmi);return}const restore=e.target.closest('[data-restore-trash]');if(restore){restorePersonalRecord(restore.dataset.restoreTrash);return}const purge=e.target.closest('[data-purge-trash]');if(purge){permanentlyDeletePersonalRecord(purge.dataset.purgeTrash);return}const paidBill=e.target.closest('[data-bill-paid]');if(paidBill){payPersonalBill(paidBill.dataset.billPaid);return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const ep=e.target.closest('[data-edit-party]');if(ep){openParty(ep.dataset.type,ep.dataset.editParty);return}const lp=e.target.closest('[data-ledger-party]');if(lp){renderLedgerParty(lp.dataset.ledgerParty);return}const pr=e.target.closest('[data-print]');if(pr){printInvoice(pr.dataset.print);return}const rec=e.target.closest('[data-print-receipt]');if(rec){printReceipt(rec.dataset.printReceipt);return}const sr=e.target.closest('[data-share-reminder]');if(sr){shareReminder(sr.dataset.shareReminder);return}const ex=e.target.closest('[data-export]');if(ex){ex.dataset.export==='csv'?exportCsv():exportData(ex.dataset.export);return}const st=e.target.closest('[data-stock]');if(st){adjustStock(st.dataset.stock);return}const epd=e.target.closest('[data-edit-product]');if(epd){openProduct(epd.dataset.editProduct);return}const pl=e.target.closest('[data-pay-invoice]');if(pl){payInvoice(pl.dataset.payInvoice);return}const si=e.target.closest('[data-share-invoice]');if(si){shareInvoice(si.dataset.shareInvoice);return}const pp=e.target.closest('[data-print-purchase]');if(pp){printPurchase(pp.dataset.printPurchase);return}const ppay=e.target.closest('[data-pay-purchase]');if(ppay){payPurchase(ppay.dataset.payPurchase);return}const qr=e.target.closest('[data-qr-invoice]');if(qr){openUpiQr(qr.dataset.qrInvoice);return}const rc=e.target.closest('[data-reconcile]');if(rc){const entry=data().entries.find(x=>x.id===rc.dataset.reconcile);if(entry){entry.reconciled=!entry.reconciled;persist();render()}return}const addLine=e.target.closest('[data-add-line]');if(addLine){$('#invoiceItems').insertAdjacentHTML('beforeend',lineRow());return}const removeLine=e.target.closest('[data-remove-line]');if(removeLine){const rows=$('#invoiceItems .invoice-row');if(rows.length>1)removeLine.closest('.invoice-row').remove();return}const ee=e.target.closest('[data-edit-entry]');if(ee){editEntry(ee.dataset.editEntry);return}const de=e.target.closest('[data-delete-entry]');if(de)deleteEntry(de.dataset.deleteEntry);const prt=e.target.closest('[data-print-report]');if(prt)window.print()});$('#modalBody').addEventListener('change',e=>{if(e.target.name==='itemProduct'){const p=data().products.find(x=>x.id===e.target.value),row=e.target.closest('.invoice-row');if(p&&row){row.querySelector('[name=itemName]').value=p.name;row.querySelector('[name=itemRate]').value=page==='purchases'?p.cost:p.price;row.querySelector('[name=itemGst]').value=18}}if(e.target.name==='source')refreshReturnItems(e.target.value);if(e.target.name==='itemIndex')refreshReturnItems($('[name=source]')?.value)});
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();if(modalAction)modalAction(new FormData(e.currentTarget))});$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#businessSelect').onchange=e=>{state.active=e.target.value;persist();go('dashboard')};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeToggle').onclick=toggleTheme;$('#quickAddBtn').onclick=()=>openEntry();document.addEventListener('keydown',e=>{if(e.key==='Escape')return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#tableSearch')?.focus();return}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='n'){e.preventDefault();openEntry();return}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='i'){e.preventDefault();openInvoice();return}});$('#view').addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();const f=new FormData(e.target);data().settings={...data().settings,...Object.fromEntries(f.entries())};current().name=data().settings.businessName||current().name;persist();render();toast('Business profile saved')}})}
